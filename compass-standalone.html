<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Angoalissar Compass</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#010810;color:#e0f7ff;font-family:'IBM Plex Mono','Courier New',monospace;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(0,220,255,.3);border-radius:2px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .25s ease}
.panel{background:rgba(0,14,28,.85);border:1px solid rgba(0,220,255,.12);border-radius:12px;backdrop-filter:blur(14px)}
button{cursor:pointer;transition:opacity .15s;font-family:'IBM Plex Mono','Courier New',monospace}
button:hover{opacity:.85}
input:focus,select:focus{outline:none;border-color:#00e5ff!important}
select option{background:#010f1e}
#app{display:flex;min-height:100vh;position:relative;z-index:1}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.sidebar{width:220px;flex-shrink:0;height:100vh;position:sticky;top:0;background:rgba(0,5,14,.97);border-right:1px solid rgba(0,220,255,.12);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s ease;z-index:10}
.sidebar.collapsed{width:58px}
main{flex:1;min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;background:rgba(1,8,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,220,255,.12);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-2l{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.content{padding:18px 22px 56px}
.ticker-wrap{overflow:hidden;border-top:1px solid rgba(0,220,255,.12);border-bottom:1px solid rgba(0,220,255,.12);height:26px;display:flex;align-items:center;background:rgba(0,6,16,.9)}
.ticker-inner{display:flex;white-space:nowrap}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;transition:all .12s;position:relative;color:#3a6070;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px}
.nav-btn.active{background:rgba(0,229,255,.1);border-left-color:#00e5ff;color:#00e5ff}
.nav-btn.collapsed-btn{justify-content:center;padding:10px 0}
.tab-btn{padding:5px 16px;border-radius:20px;font-size:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;border:1px solid rgba(0,220,255,.12);background:rgba(0,180,220,.04);color:#3a6070;letter-spacing:.5px}
.tab-btn.active{background:rgba(0,229,255,.18);border-color:#00e5ff;color:#00e5ff;box-shadow:0 0 12px rgba(0,229,255,.25)}
.neon{text-shadow:0 0 12px rgba(0,229,255,.5),0 0 24px rgba(0,229,255,.18)}
table{width:100%;border-collapse:collapse}
th{padding:8px 12px;text-align:left;color:#3a6070;font-weight:700;font-size:9px;letter-spacing:1px;background:rgba(0,229,255,.06)}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(0,220,255,.06)}
.province-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-box{padding:26px;width:100%;max-width:520px;border:1px solid rgba(0,220,255,.5)}
.mob-btn{display:none}
@media(max-width:768px){
  .sidebar{display:none!important}
  .mob-btn{display:flex!important}
  .grid-3{grid-template-columns:1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .grid-2l{grid-template-columns:1fr!important}
  .kpi-grid{grid-template-columns:repeat(2,1fr)!important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<div id="modals"></div>

<script>
// ─── Bloomberg Background ─────────────────────────────────────────────────────
(function(){
  var c=document.getElementById('bg'),ctx=c.getContext('2d'),w,h,t=0,nodes=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;nodes=[];for(var i=0;i<14;i++)nodes.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,p:Math.random()*Math.PI*2});}
  resize();window.addEventListener('resize',resize);
  function draw(){
    t+=.007;ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#010810';ctx.fillRect(0,0,w,h);
    var vg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.75);
    vg.addColorStop(0,'rgba(0,20,42,0)');vg.addColorStop(1,'rgba(0,0,8,.75)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
    for(var x=0;x<w;x+=46){ctx.strokeStyle='rgba(0,220,255,'+((.03+Math.sin(x*.018+t*.4)*.013))+')';ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(var y=0;y<h;y+=46){ctx.strokeStyle='rgba(0,200,255,'+((.03+Math.sin(y*.018+t*.3)*.013))+')';ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    var sy=((t*28)%(h+40))-20;
    var sg=ctx.createLinearGradient(0,sy-3,0,sy+3);sg.addColorStop(0,'rgba(0,220,255,0)');sg.addColorStop(.5,'rgba(0,220,255,.05)');sg.addColorStop(1,'rgba(0,220,255,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,sy-3,w,6);
    nodes.forEach(function(n){
      n.x+=n.vx;n.y+=n.vy;n.p+=.025;
      if(n.x<0||n.x>w)n.vx*=-1;if(n.y<0||n.y>h)n.vy*=-1;
      var g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,22+Math.sin(n.p)*6);
      g.addColorStop(0,'rgba(0,220,255,'+(.25+Math.sin(n.p)*.12)+')');g.addColorStop(1,'rgba(0,220,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,22,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(200,245,255,'+(.6+Math.sin(n.p)*.3)+')';ctx.beginPath();ctx.arc(n.x,n.y,1.5,0,Math.PI*2);ctx.fill();
    });
    nodes.forEach(function(n,i){nodes.slice(i+1).forEach(function(m){var d=Math.hypot(n.x-m.x,n.y-m.y);if(d<150){ctx.strokeStyle='rgba(0,180,255,'+((1-d/150)*.07)+')';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(m.x,m.y);ctx.stroke();}});});
    var corners=[[2,2],[w-62,2],[2,h-42],[w-62,h-42]];
    corners.forEach(function(cr){var cx=cr[0],cy=cr[1];ctx.strokeStyle='rgba(0,220,255,'+(.13+Math.sin(t)*.04)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy+13);ctx.lineTo(cx,cy);ctx.lineTo(cx+13,cy);ctx.moveTo(cx+47,cy);ctx.lineTo(cx+60,cy);ctx.lineTo(cx+60,cy+13);ctx.moveTo(cx,cy+27);ctx.lineTo(cx,cy+40);ctx.lineTo(cx+13,cy+40);ctx.moveTo(cx+47,cy+40);ctx.lineTo(cx+60,cy+40);ctx.lineTo(cx+60,cy+27);ctx.stroke();});
    requestAnimationFrame(draw);
  }
  draw();
})();

// ─── Data ─────────────────────────────────────────────────────────────────────
var PROVINCES=['Luanda','Benguela','Huila','Cabinda','Cuanza Norte','Cuanza Sul','Malanje','Lunda Norte','Namibe','Uige','Huambo','Bie','Cunene','Moxico','Zaire','Bengo','Lunda Sul','Cuando Cubango'];
var COMMODITIES=['Rice','Maize','Beans','Oil','Sugar','Flour'];
var BRANDS=['Madrugada','Aguia','Stallion','Patriota','Uncle Sam'];
var REGIONS=['Luanda','Benguela','Huambo','Lobito','Lubango','Cabinda','Namibe','Uige'];
var CHANNELS=['Wholesale','Retail','HoReCa','Modern Trade'];
var PR={Rice:[400,800],Maize:[200,500],Beans:[600,1200],Oil:[1000,2000],Sugar:[500,1000],Flour:[300,700]};
var SENT_COLOR={positive:'#00ff88',neutral:'#ffaa00',negative:'#ff3b5c'};
var CAT_COLOR={macro:'#00e5ff',commodity:'#ffaa00',competitor:'#ff3b5c',regulatory:'#00ff88'};

function rnd(a,b){return Math.floor(Math.random()*(b-a+1)+a);}
function rndF(a,b){return parseFloat((Math.random()*(b-a)+a).toFixed(2));}
function fmt(n){return(n||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function fmtM(n){return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':fmt(n);}
function glow(c,s){s=s||12;return '0 0 '+s+'px '+c+'40,0 0 '+(s*2)+'px '+c+'18';}
function hex2(n){return Math.round(n).toString(16).padStart(2,'0');}

var ALL_PRICES=[];
PROVINCES.forEach(function(p){COMMODITIES.forEach(function(c){ALL_PRICES.push({province:p,commodity:c,price:rnd(PR[c][0],PR[c][1]),currency:'AOA',unit:'kg'});});});

function genHistory(commodity){
  var base=500,arr=[];
  for(var i=0;i<ALL_PRICES.length;i++){if(ALL_PRICES[i].commodity===commodity){base=ALL_PRICES[i].price;break;}}
  var price=base*.85;
  for(var d=60;d>=0;d--){
    var dt=new Date();dt.setDate(dt.getDate()-d);
    price+=(Math.random()-.5)*base*.04;
    arr.push({date:dt.toISOString().slice(0,10),price:Math.round(price)});
  }
  return arr;
}
function genForecast(commodity){
  var base=500;
  for(var i=0;i<ALL_PRICES.length;i++){if(ALL_PRICES[i].commodity===commodity){base=ALL_PRICES[i].price;break;}}
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var cur=new Date().getMonth();
  return months.map(function(m,i){return{month:m,actual:i<=cur?Math.round(base*(1+(i-5)*.006)+(Math.random()-.5)*base*.04):null,forecast:Math.round(base*(1+(i-5)*.007)),upper:Math.round(base*(1+(i-5)*.007)*1.07),lower:Math.round(base*(1+(i-5)*.007)*.93)};});
}

var DISTRIBUTORS=[];
['Norte Distributors','Sul Commerce','Benguela Trade','Luanda Wholesale','Cabinda Supply','Huambo Distrib','Lobito Commerce','Namibe Traders'].forEach(function(name,i){
  var sales=rnd(65,115),profit=rndF(4,18),collect=rnd(70,98),coverage=rnd(55,95),growth=rndF(-5,22);
  var score=Math.min(Math.round((Math.min(sales,100)*.3+profit*2+collect*.25+coverage*.2+Math.max(growth+5,0)*1.5)/1.5),100);
  DISTRIBUTORS.push({id:i,name:name,region:REGIONS[i%8],sales:sales,profit:profit,collect:collect,coverage:coverage,growth:growth,score:score,rank:0});
});
DISTRIBUTORS.sort(function(a,b){return b.score-a.score;});
DISTRIBUTORS.forEach(function(d,i){d.rank=i+1;});

var SKU_MARGINS=[];
['Madrugada Flour 50kg','Aguia Flour 25kg','Stallion Flour 50kg','Patriota Rice 25kg','Uncle Sam Rice 5kg','Sugar 50kg','Beans 25kg','Oil 5L'].forEach(function(sku){
  REGIONS.slice(0,4).forEach(function(region){
    var rev=rnd(80000,500000),cp=rndF(.79,.96);
    SKU_MARGINS.push({sku:sku,brand:BRANDS[rnd(0,4)],region:region,channel:CHANNELS[rnd(0,3)],rev:rev,cost:Math.round(rev*cp),margin:parseFloat(((1-cp)*100).toFixed(1))});
  });
});

var NEWS=[
  {id:'n1',headline:'BNA holds interest rate at 19.5% — credit impact expected',source:'Jornal de Angola',date:'2026-05-22',cat:'macro',sent:'neutral',prov:'Luanda'},
  {id:'n2',headline:'Rice prices up 8% in Luanda following informal market shortage',source:'Expansao',date:'2026-05-21',cat:'commodity',sent:'negative',prov:'Luanda'},
  {id:'n3',headline:'Sodosa expands distribution to Malanje and Bie',source:'Mercado',date:'2026-05-20',cat:'competitor',sent:'negative',prov:null},
  {id:'n4',headline:'Government announces flour subsidy — AOA 2/kg',source:'MINFIN',date:'2026-05-20',cat:'regulatory',sent:'positive',prov:null},
  {id:'n5',headline:'Kwanza stabilises vs dollar: USD/AOA at 878.4',source:'BNA',date:'2026-05-19',cat:'macro',sent:'neutral',prov:null},
  {id:'n6',headline:'Maize harvest in Huambo exceeds forecast by 12%',source:'MINAGRIF',date:'2026-05-18',cat:'commodity',sent:'positive',prov:'Huambo'},
  {id:'n7',headline:'Noble Group enters packaged flour segment',source:'Expansao',date:'2026-05-17',cat:'competitor',sent:'negative',prov:null},
  {id:'n8',headline:'Kero and Candando negotiate exclusive sugar discounts',source:'Mercado',date:'2026-05-16',cat:'competitor',sent:'negative',prov:'Luanda'}
];

var KPI={rev:2840000000,vol:21868,margin:6.4,cust:312,dso:38,region:'Luanda',growth:4.2,mvt:-2.1};
var FX=[{pair:'USD/AOA',rate:878.4,chg:.3},{pair:'EUR/AOA',rate:953.2,chg:-.8},{pair:'CNY/AOA',rate:121.3,chg:.1},{pair:'GBP/AOA',rate:1112.7,chg:1.2},{pair:'BRL/AOA',rate:159.6,chg:-.4}];
var PMAP=[{id:'Luanda',cx:95,cy:165,r:16},{id:'Benguela',cx:75,cy:210,r:14},{id:'Huila',cx:110,cy:265,r:13},{id:'Cabinda',cx:80,cy:100,r:11},{id:'Huambo',cx:135,cy:235,r:13},{id:'Namibe',cx:68,cy:290,r:11},{id:'Uige',cx:120,cy:120,r:11},{id:'Malanje',cx:170,cy:165,r:11},{id:'Bie',cx:165,cy:225,r:12},{id:'Lunda Norte',cx:245,cy:130,r:11},{id:'Lunda Sul',cx:235,cy:185,r:11},{id:'Moxico',cx:235,cy:245,r:12},{id:'Cuanza Norte',cx:125,cy:145,r:10},{id:'Cuanza Sul',cx:110,cy:195,r:11},{id:'Cuando Cubango',cx:205,cy:295,r:12},{id:'Cunene',cx:135,cy:310,r:11},{id:'Zaire',cx:95,cy:108,r:10},{id:'Bengo',cx:100,cy:148,r:10}];

// ─── State ────────────────────────────────────────────────────────────────────
var S={
  section:'overview',province:null,collapsed:false,
  commodity:'Rice',groupBy:'brand',newsCat:null,
  copilotTab:'chat',copilotTone:'moderate',copilotHorizon:'30 days',
  msgs:[],copilotLoading:false,
  landed:{baseCostUSD:18.5,freightUSD:2.8,customsDuty:10,fxRate:870,otherCosts:500,sellingPrice:24500},
  settings:{copilotMemory:10,devilTone:'moderate',briefingEnabled:false,briefingTime:'07:30'},
  briefings:[],
  histCache:{},fcastCache:{},
  fxRates:JSON.parse(JSON.stringify(FX))
};
try{var ss=localStorage.getItem('compass_settings');if(ss)S.settings=Object.assign(S.settings,JSON.parse(ss));}catch(e){}
try{var sp=localStorage.getItem('compass_province');if(sp)S.province=sp;}catch(e){}
try{var sb=localStorage.getItem('compass_briefings');if(sb)S.briefings=JSON.parse(sb);}catch(e){}
COMMODITIES.forEach(function(c){S.histCache[c]=genHistory(c);S.fcastCache[c]=genForecast(c);});

setInterval(function(){
  S.fxRates=S.fxRates.map(function(r){return{pair:r.pair,rate:parseFloat((r.rate+(Math.random()-.5)*.9).toFixed(1)),chg:parseFloat((r.chg+(Math.random()-.5)*.1).toFixed(2))};});
  var ti=document.querySelector('.ticker-inner');if(ti)ti.innerHTML=buildTickerHTML();
},2800);

// ─── SVG Charts ───────────────────────────────────────────────────────────────
function pathPoints(vals,w,h){
  if(!vals.length)return'';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var range=mx-mn||1;
  return vals.map(function(v,i){return (i===0?'M':'L')+(i/(vals.length-1)*w)+','+(h-(v-mn)/range*h);}).join(' ');
}

function areaChart(data,key,color,w,h){
  w=w||280;h=h||120;
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return '';
  var p=pathPoints(vals,w,h);
  var id='ag'+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="5%" stop-color="'+color+'" stop-opacity=".2"/>'
    +'<stop offset="95%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path d="'+p+' L'+w+','+h+' L0,'+h+' Z" fill="url(#'+id+')" />'
    +'<path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2"/>'
    +'</svg>';
}

function barChart(labels,vals,color,w,h){
  w=w||280;h=h||130;color=color||'#00e5ff';
  if(!vals.length)return '';
  var mx=Math.max.apply(null,vals)||1;
  var bw=Math.floor(w/vals.length*.65),gap=Math.floor(w/vals.length);
  var bars='';
  vals.forEach(function(v,i){
    var bh=Math.round((v/mx)*(h-4));
    var x=i*gap+(gap-bw)/2,y=h-bh;
    bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+color+'"/>';
    var lbl=labels[i]?labels[i].slice(0,5):'';
    bars+='<text x="'+(x+bw/2)+'" y="'+(h+14)+'" text-anchor="middle" fill="#3a6070" font-size="9" font-family="monospace">'+lbl+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+(h+18)+'" style="width:100%;height:'+(h+18)+'px;display:block">'+bars+'</svg>';
}

function radarChart(items,color,size){
  size=size||180;color=color||'#00e5ff';
  var cx=size/2,cy=size/2,r=size*.38;
  var n=items.length;
  if(!n)return '';
  function pt(i,v){var a=i/n*Math.PI*2-Math.PI/2;return{x:cx+Math.cos(a)*v,y:cy+Math.sin(a)*v};}
  var polyPts=items.map(function(d,i){var p=pt(i,r*d.v/100);return p.x+','+p.y;}).join(' ');
  var axes='',grid='',labels='';
  [.25,.5,.75,1].forEach(function(lvl){
    var gpts=items.map(function(d,i){var p=pt(i,r*lvl);return p.x+','+p.y;}).join(' ');
    grid+='<polygon points="'+gpts+'" fill="none" stroke="rgba(0,220,255,.15)" stroke-width=".5"/>';
  });
  items.forEach(function(d,i){
    var p=pt(i,r),lp=pt(i,r+18);
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x+'" y2="'+p.y+'" stroke="rgba(0,220,255,.12)" stroke-width=".5"/>';
    labels+='<text x="'+lp.x+'" y="'+lp.y+'" text-anchor="middle" dominant-baseline="middle" fill="#3a6070" font-size="9" font-family="monospace">'+d.s+'</text>';
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:100%;height:'+size+'px;display:block">'+grid+axes+'<polygon points="'+polyPts+'" fill="'+color+'18" stroke="'+color+'" stroke-width="1.5"/>'+labels+'</svg>';
}

function forecastChart(data,w,h){
  w=w||280;h=h||150;
  if(!data.length)return '';
  var allV=[];data.forEach(function(d){if(d.upper)allV.push(d.upper);if(d.lower)allV.push(d.lower);});
  var mn=Math.min.apply(null,allV)*.97,mx=Math.max.apply(null,allV)*1.03,range=mx-mn||1;
  function px(i,v){return (i/(data.length-1)*w)+','+(h-(v-mn)/range*h);}
  var upper=data.map(function(d,i){return px(i,d.upper);}).join(' L');
  var lower=data.map(function(d,i){return px(i,d.lower);}).join(' L');
  var lowerR=data.slice().reverse().map(function(d,i){return px(data.length-1-i,d.lower);}).join(' L');
  var fcast=data.map(function(d,i){return px(i,d.forecast);}).join(' L');
  var actualPts=data.filter(function(d){return d.actual;}).map(function(d,i){return px(i,d.actual);});
  var monthsRow=data.map(function(d,i){return '<text x="'+(i/(data.length-1)*w)+'" y="'+(h+12)+'" text-anchor="middle" fill="#3a6070" font-size="8" font-family="monospace">'+d.month+'</text>';}).join('');
  return '<svg viewBox="0 0 '+w+' '+(h+16)+'" style="width:100%;height:'+(h+16)+'px;display:block">'
    +'<path d="M'+upper+' L'+lowerR+' Z" fill="rgba(0,255,136,.07)"/>'
    +'<path d="M'+fcast+'" fill="none" stroke="#00ff88" stroke-width="2"/>'
    +(actualPts.length?'<path d="M'+actualPts.join(' L')+'" fill="none" stroke="#7aacbc" stroke-width="1.5" stroke-dasharray="4 2"/>'  :'')
    +monthsRow+'</svg>';
}

// ─── DOM helpers ──────────────────────────────────────────────────────────────
function div(cls,html,style){
  var d=document.createElement('div');
  if(cls)d.className=cls;
  if(html)d.innerHTML=html;
  if(style)d.style.cssText=style;
  return d;
}
function btn(text,cls,style,onclick){
  var b=document.createElement('button');
  b.textContent=text;if(cls)b.className=cls;if(style)b.style.cssText=style;
  if(onclick)b.addEventListener('click',onclick);
  return b;
}
function inp(type,val,style,oninput){
  var i=document.createElement('input');i.type=type;i.value=val||'';
  if(style)i.style.cssText=style;if(oninput)i.addEventListener('input',oninput);
  return i;
}

function kpiCard(label,value,sub,trend,accent,emoji){

  var eDiv=div('');eDiv.style.cssText='position:absolute;top:10px;right:12px;opacity:.15;font-size:26px';eDiv.textContent=emoji;c.appendChild(eDiv);

function buildMap(prov){

  svg.appendChild(svgEl('path',{d:'M82,100 L95,92 L120,90 L155,88 L200,92 L230,108 L255,125 L268,150 L265,180 L258,210 L250,240 L238,265 L215,280 L195,295 L170,305 L145,308 L120,300 L100,288 L78,270 L65,248 L58,220 L55,195 L60,170 L68,148 L78,125 Z',fill:'rgba(0,40,70,.35)',stroke:'rgba(0,220,255,.2)','stroke-width':'1.2'}));
  [120,150,180,210,240].forEach(function(y){svg.appendChild(svgEl('line',{x1:'55',y1:y,x2:'270',y2:y,stroke:'rgba(0,220,255,.07)','stroke-width':'.4'}));});
  [80,120,160,200,240].forEach(function(x){svg.appendChild(svgEl('line',{x1:x,y1:'88',x2:x,y2:'310',stroke:'rgba(0,220,255,.07)','stroke-width':'.4'}));});

  PMAP.forEach(function(p){
    var isSel=prov===p.id,color=isSel?'#ffaa00':'#00e5ff',r=p.r*(isSel?1.6:1);
    var g=document.createElementNS(ns,'g');g.style.cursor='pointer';
    var glow1=document.createElementNS(ns,'circle');glow1.setAttribute('cx',p.cx);glow1.setAttribute('cy',p.cy);glow1.setAttribute('r',r*2.5);glow1.setAttribute('fill',color+'25');
    var c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.cx);c.setAttribute('cy',p.cy);c.setAttribute('r',r);c.setAttribute('fill',color+'60');c.setAttribute('stroke',color);c.setAttribute('stroke-width',isSel?'1.6':'.7');c.style.filter='drop-shadow(0 0 '+r+'px '+color+'90)';
    g.appendChild(glow1);g.appendChild(c);
    if(isSel||p.id==='Luanda'){var t=document.createElementNS(ns,'text');t.setAttribute('x',p.cx+p.r+3);t.setAttribute('y',p.cy+4);t.setAttribute('fill',isSel?'#ffaa00':'#00b8cc');t.setAttribute('font-size','7');t.setAttribute('font-family','monospace');t.setAttribute('font-weight','700');t.textContent=p.id.length>9?p.id.slice(0,8):p.id;g.appendChild(t);}

async function sendMsg(msg){
  if(!msg||!msg.trim()||S.copilotLoading)return;
  S.msgs=S.msgs.concat([{role:'user',content:msg}]);
  S.copilotLoading=true;renderSection();
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are the Commercial Copilot for Angoalissar Lda (Webcor Group), FMCG Angola. Revenue '+fmtM(KPI.rev)+' AOA, Volume '+fmt(KPI.vol)+' MT, Margin '+KPI.margin+'%. Scope: '+(S.province||'All Angola')+'. Competitors: Noble Group, Sodosa, Alimenta Angola. Be direct and action-oriented. Respond in English.',messages:S.msgs.slice(-20).map(function(m){return{role:m.role,content:m.content};})})});
    var data=await r.json();
    var reply=(data.content&&data.content.find(function(c){return c.type==='text';}))?data.content.find(function(c){return c.type==='text';}).text:'No response.';
    S.msgs=S.msgs.concat([{role:'assistant',content:reply}]);
  }catch(e){S.msgs=S.msgs.concat([{role:'assistant',content:'⚠ Anthropic API not configured. Add your API key to enable the Copilot.'}]);}
  S.copilotLoading=false;renderSection();
}

async function genBriefing(type){
  var toneMap={mild:'gentle',moderate:'direct and critical',brutal:'brutally honest'};
  var prompt=type==='briefing'?'Generate a daily executive briefing for Angoalissar. Scope: '+(S.province||'All Angola')+'. Horizon: '+S.copilotHorizon+'. Include KPIs, risks, opportunities, 3 priority actions.':'Devil\'s Advocate ('+toneMap[S.copilotTone]+'): Challenge Angoalissar\'s performance. Scope: '+(S.province||'All Angola')+'. Identify blind spots and ignored risks.';
  S.copilotTab='chat';await sendMsg(prompt);
  var last=S.msgs[S.msgs.length-1];
  if(last&&last.role==='assistant'){
    var b={id:Date.now().toString(),title:type==='briefing'?'Executive Briefing — '+new Date().toLocaleDateString('en-GB'):"Devil's Advocate — "+new Date().toLocaleDateString('en-GB'),content:last.content,type:type,province:S.province,tone:S.copilotTone,horizon:S.copilotHorizon,generatedAt:new Date().toISOString()};
    S.briefings=[b].concat(S.briefings);
    try{localStorage.setItem('compass_briefings',JSON.stringify(S.briefings.slice(0,50)));}catch(e){}
  }
}

  var togBtn=btn('☰','');togBtn.style.cssText='background:none;border:none;color:#3a6070;padding:4px;font-size:18px;font-family:inherit';togBtn.addEventListener('click',function(){S.collapsed=!S.collapsed;render();});logo.appendChild(togBtn);sb.appendChild(logo);
  if(!collapsed){var pp=div('');pp.style.cssText='padding:8px 12px;border-bottom:1px solid rgba(0,220,255,.12)';pp.appendChild(provincePill(S.province));sb.appendChild(pp);}
  var nav=div('');nav.style.cssText='flex:1;padding-top:6px';
  NAV.forEach(function(item){
    var isA=S.section===item.key;
    var nb=btn('','nav-btn'+(isA?' active':'')+(collapsed?' collapsed-btn':''));
    if(isA){var bar=div('');bar.style.cssText='position:absolute;left:2px;top:18%;bottom:18%;width:2px;background:#00e5ff;border-radius:1px;box-shadow:'+glow('#00e5ff',8);nb.appendChild(bar);}
    var ico=document.createElement('span');ico.style.cssText='font-size:15px;filter:'+(isA?'drop-shadow(0 0 6px #00e5ff)':'none');ico.textContent=item.e;nb.appendChild(ico);
    if(!collapsed){var lbl=document.createElement('span');lbl.style.cssText='font-size:11px;font-weight:'+(isA?700:400)+';color:'+(isA?'#00e5ff':'#3a6070')+';flex:1;text-align:left;letter-spacing:.5px';lbl.textContent=item.label;nb.appendChild(lbl);}
    if(!collapsed&&item.badge){var bdg=div('');bdg.style.cssText='font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;background:rgba(0,229,255,.2);color:#00e5ff;border:1px solid rgba(0,229,255,.4);letter-spacing:1px';bdg.textContent=item.badge;nb.appendChild(bdg);}
    nb.addEventListener('click',function(){S.section=item.key;renderSection();closeMobileSidebar();});
    nav.appendChild(nb);
  });
  sb.appendChild(nav);
  if(!collapsed){
    var feed=div('');feed.style.cssText='border-top:1px solid rgba(0,220,255,.12);padding:10px 12px';
    var feedH=div('');feedH.style.cssText='font-size:8px;color:#3a6070;font-weight:800;margin-bottom:8px;letter-spacing:2px';feedH.textContent='◉ LIVE · '+(S.province?S.province.toUpperCase():'ALL');feed.appendChild(feedH);
    NEWS.filter(function(n){return !S.province||!n.prov||n.prov===S.province;}).slice(0,3).forEach(function(n){
      var row=div('');row.style.cssText='display:flex;gap:6px;margin-bottom:8px;align-items:flex-start';
      var dot=div('');dot.style.cssText='width:4px;height:4px;border-radius:50%;background:'+SENT_COLOR[n.sent]+';margin-top:4px;flex-shrink:0';row.appendChild(dot);
      var nt=div('');nt.style.cssText='font-size:9px;color:#3a6070;line-height:1.4';nt.textContent=n.headline.slice(0,52)+'…';row.appendChild(nt);feed.appendChild(row);
    });
    sb.appendChild(feed);
  }
  return sb;
}

// ─── Ticker ───────────────────────────────────────────────────────────────────
function buildTickerHTML(){
  var items=S.fxRates.concat(S.fxRates);
  return items.map(function(r){return '<span style="padding:0 18px;font-size:10px;border-right:1px solid rgba(0,220,255,.12);display:inline-flex;align-items:center;gap:7px"><span style="color:#3a6070;font-weight:700">'+r.pair+'</span><span style="color:#e0f7ff;font-weight:800">'+r.rate.toFixed(1)+'</span><span style="color:'+(r.chg>=0?'#00ff88':'#ff3b5c')+';font-size:9px">'+(r.chg>=0?'▲':'▼')+' '+Math.abs(r.chg).toFixed(1)+'</span></span>';}).join('');
}

var tickerOffset=0,tickerRaf;
function startTicker(){
  if(tickerRaf)cancelAnimationFrame(tickerRaf);
  function run(){
    var inner=document.querySelector('.ticker-inner');
    if(inner){tickerOffset-=.5;if(tickerOffset<-inner.scrollWidth/2)tickerOffset=0;inner.style.transform='translateX('+tickerOffset+'px)';}
    tickerRaf=requestAnimationFrame(run);
  }
  tickerRaf=requestAnimationFrame(run);
}

// ─── Province helpers ─────────────────────────────────────────────────────────
function setProv(p){S.province=p;try{p?localStorage.setItem('compass_province',p):localStorage.removeItem('compass_province');}catch(e){}render();}

function buildProvDropdown(parent){
  var existing=document.getElementById('provDD');if(existing)existing.remove();
  var dd=div('panel');dd.id='provDD';dd.style.cssText='position:absolute;top:110%;right:0;width:210px;z-index:100;padding:6px;max-height:280px;overflow-y:auto;border:1px solid rgba(0,220,255,.5);box-shadow:0 8px 32px rgba(0,0,0,.75)';
  var allb=btn('All Provinces','');allb.style.cssText='width:100%;padding:7px 10px;border-radius:6px;background:'+(!S.province?'rgba(0,229,255,.15)':'transparent')+';border:none;color:'+(!S.province?'#00e5ff':'#3a6070')+';text-align:left;font-size:11px;font-weight:'+(!S.province?700:400)+';font-family:inherit';
  allb.addEventListener('click',function(e){e.stopPropagation();setProv(null);dd.remove();});dd.appendChild(allb);
  PROVINCES.forEach(function(p){var pb=btn(p,'');pb.style.cssText='width:100%;padding:6px 10px;border-radius:6px;background:'+(S.province===p?'rgba(0,229,255,.12)':'transparent')+';border:none;color:'+(S.province===p?'#00e5ff':'#3a6070')+';text-align:left;font-size:10px;font-weight:'+(S.province===p?700:400)+';font-family:inherit';pb.addEventListener('click',function(e){e.stopPropagation();setProv(p);dd.remove();});dd.appendChild(pb);});
  parent.style.position='relative';parent.appendChild(dd);
  setTimeout(function(){document.addEventListener('click',function rmDD(){dd.remove();document.removeEventListener('click',rmDD);});},10);
}

function closeMobileSidebar(){var mob=document.getElementById('mobileSidebar');if(mob)document.body.removeChild(mob);}

// ─── CSV / PPTX Modals ────────────────────────────────────────────────────────
function openCSV(){
  var prov=S.province,prices=prov?ALL_PRICES.filter(function(p){return p.province===prov;}):ALL_PRICES;
  var mb=div('modal-bg');
  var box=div('panel modal-box');
  var hrow=div('');hrow.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:16px';
  var htxt=div('');htxt.innerHTML='<div style="font-size:14px;font-weight:900;color:#e0f7ff">EXPORT CSV</div>';htxt.appendChild(provincePill(prov));hrow.appendChild(htxt);
  var xb=btn('✕','');xb.style.cssText='background:none;border:none;color:#3a6070;font-size:20px;font-family:inherit';xb.addEventListener('click',function(){mb.remove();});hrow.appendChild(xb);box.appendChild(hrow);
  var info=div('');info.style.cssText='font-size:10px;color:#3a6070;margin-bottom:10px';info.textContent=prices.length+' rows · Preview:';box.appendChild(info);
  var prev=div('');prev.style.cssText='overflow-x:auto;background:rgba(0,229,255,.04);border-radius:8px;padding:10px;margin-bottom:16px;border:1px solid rgba(0,220,255,.12)';
  var tbl=document.createElement('table');var cols=['province','commodity','price','currency','unit'];
  var thead=document.createElement('thead');thead.innerHTML='<tr>'+cols.map(function(c){return '<th style="color:#00e5ff">'+c+'</th>';}).join('')+'</tr>';tbl.appendChild(thead);
  var tbody=document.createElement('tbody');prices.slice(0,5).forEach(function(r){var tr=document.createElement('tr');tr.innerHTML=cols.map(function(c){return '<td style="color:#7aacbc;font-size:10px;padding:4px 10px;border-top:1px solid rgba(0,220,255,.08)">'+r[c]+'</td>';}).join('');tbody.appendChild(tr);});tbl.appendChild(tbody);prev.appendChild(tbl);box.appendChild(prev);
  var dlb=btn('⬇ DOWNLOAD CSV','');dlb.style.cssText='padding:11px 22px;background:rgba(0,229,255,.15);border:1px solid #00e5ff;border-radius:8px;color:#00e5ff;font-size:11px;font-weight:800;font-family:inherit;box-shadow:'+glow('#00e5ff',8);
  dlb.addEventListener('click',function(){var csv=[cols.join(',')].concat(prices.map(function(r){return cols.map(function(c){return r[c];}).join(',');})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='compass_'+(prov||'all')+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();mb.remove();});
  box.appendChild(dlb);mb.appendChild(box);document.body.appendChild(mb);
}

function openPPTX(){
  var prov=S.province;
  var mb=div('modal-bg');
  var box=div('panel modal-box');box.style.maxWidth='500px';box.style.border='1px solid rgba(0,220,255,.5)';
  var hrow=div('');hrow.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px';
  var htxt=div('');htxt.innerHTML='<div style="font-size:15px;font-weight:900;color:#e0f7ff;letter-spacing:1px">BOARD PRESENTATION</div><div style="font-size:10px;color:#3a6070;margin-top:3px">Export to PowerPoint</div>';htxt.appendChild(provincePill(prov));hrow.appendChild(htxt);
  var xb=btn('✕','');xb.style.cssText='background:none;border:none;color:#3a6070;font-size:20px;font-family:inherit';xb.addEventListener('click',function(){mb.remove();});hrow.appendChild(xb);box.appendChild(hrow);
  [['📊','Executive Summary','Revenue, volume, margin, DSO KPIs'],['💹','Market Prices','Commodity prices by province and trend'],['👥','Distributor Performance','Rankings, scorecards, radar profile'],['📈','Profitability Analysis','Margin by brand, region, channel, SKU'],['⚡','Risks & Opportunities','Market intelligence and competitive analysis'],['🎯','Action Plan','3 priority commercial actions']].forEach(function(si,i){
    var row=div('');row.style.cssText='display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(0,229,255,.07);border:1px solid rgba(0,220,255,.12);border-radius:8px;margin-bottom:8px';
    row.innerHTML='<span style="font-size:18px">'+si[0]+'</span><div style="flex:1"><div style="font-size:12px;font-weight:700;color:#e0f7ff">Slide '+(i+1)+': '+si[1]+'</div><div style="font-size:10px;color:#3a6070">'+si[2]+'</div></div>';
    box.appendChild(row);
  });
  var expb=btn('📊 EXPORT PPTX','');expb.style.cssText='width:100%;margin-top:4px;padding:13px;background:rgba(0,229,255,.15);border:1px solid #00e5ff;border-radius:10px;color:#00e5ff;font-size:12px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:'+glow('#00e5ff',10);
  expb.addEventListener('click',function(){var lines=['ANGOALISSAR COMPASS — BOARD PRESENTATION','Generated: '+new Date().toLocaleString('en-GB'),'Scope: '+(prov||'All Angola'),''].concat([['Executive Summary','Revenue, volume, margin KPIs'],['Market Prices','Commodity prices by province'],['Distributor Performance','Rankings and scorecards'],['Profitability Analysis','Margin by brand and channel'],['Risks & Opportunities','Market intelligence'],['Action Plan','3 priority actions']].map(function(si,i){return 'SLIDE '+(i+1)+': '+si[0]+'\n'+si[1];}));var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='Angoalissar_Board_'+(prov||'Angola')+'_'+new Date().toISOString().slice(0,10)+'.txt';a.click();mb.remove();});
  box.appendChild(expb);mb.appendChild(box);document.body.appendChild(mb);
}

// ─── Main render ──────────────────────────────────────────────────────────────
function renderSection(){
  var mc=document.getElementById('mainContent');if(!mc)return;mc.innerHTML='';
  var fns={overview:renderOverview,commodities:renderCommodities,distributors:renderDistributors,profitability:renderProfitability,landed:renderLandedCost,copilot:renderCopilot,briefings:renderBriefings,news:renderNews,settings:renderSettings};
  var fn=fns[S.section];if(fn)mc.appendChild(fn());
}

function render(){
  var app=document.getElementById('app');app.innerHTML='';
  // Sidebar
  app.appendChild(buildSidebar(S.collapsed));
  // Main
  var main=document.createElement('main');
  // Topbar
  var topbar=div('topbar');
  var tl=div('');tl.style.cssText='display:flex;align-items:center;gap:12px';
  var mobBtn=btn('☰','mob-btn');mobBtn.style.cssText='background:none;border:none;color:#00b8cc;padding:4px;font-size:20px;font-family:inherit;display:none';
  mobBtn.addEventListener('click',function(){
    var existing=document.getElementById('mobileSidebar');if(existing){existing.remove();return;}
    var overlay=div('');overlay.id='mobileSidebar';overlay.style.cssText='position:fixed;inset:0;z-index:200';
    var bg=div('');bg.style.cssText='position:absolute;inset:0;background:rgba(0,0,0,.75)';bg.addEventListener('click',function(){overlay.remove();});
    var msb=buildSidebar(false);msb.style.cssText=msb.style.cssText+'position:absolute;left:0;top:0;bottom:0;display:flex!important';
    overlay.appendChild(bg);overlay.appendChild(msb);document.body.appendChild(overlay);
  });
  tl.appendChild(mobBtn);
  var secInfo=div('');
  var secName=NAV.find(function(n){return n.key===S.section;});
  secInfo.innerHTML='<div style="font-size:13px;font-weight:800;color:#e0f7ff;letter-spacing:1px;text-shadow:'+glow('#00e5ff',6)+'">'+((secName&&secName.label)||'').toUpperCase()+'</div><div style="font-size:9px;color:#3a6070;letter-spacing:1px">'+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div>';
  tl.appendChild(secInfo);topbar.appendChild(tl);
  var tr=div('');tr.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  // Province btn
  var provWrap=div('');provWrap.style.position='relative';
  var provBtn=btn('','');provBtn.style.cssText='display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(0,229,255,.08);border:1px solid rgba(0,220,255,.12);border-radius:8px;color:#7aacbc;font-size:10px;font-family:inherit';
  provBtn.innerHTML='📍 <span style="color:#e0f7ff;font-weight:700">'+(S.province||'ALL')+'</span> ▾';
  provBtn.addEventListener('click',function(e){e.stopPropagation();buildProvDropdown(provWrap);});
  provWrap.appendChild(provBtn);tr.appendChild(provWrap);
  var pptxBtn=btn('📊 PPTX','');pptxBtn.style.cssText='padding:6px 12px;background:rgba(0,102,255,.12);border:1px solid rgba(0,102,255,.5);border-radius:8px;color:#6699ff;font-size:10px;font-weight:700;font-family:inherit';
  pptxBtn.addEventListener('click',openPPTX);tr.appendChild(pptxBtn);
  var csvBtn=btn('⬇ CSV','');csvBtn.style.cssText='padding:6px 12px;background:rgba(0,229,255,.08);border:1px solid rgba(0,220,255,.12);border-radius:8px;color:#00b8cc;font-size:10px;font-weight:700;font-family:inherit';
  csvBtn.addEventListener('click',openCSV);tr.appendChild(csvBtn);
  topbar.appendChild(tr);main.appendChild(topbar);
  // FX Ticker
  var ticker=div('ticker-wrap');ticker.innerHTML='<div class="ticker-inner" style="display:flex;white-space:nowrap">'+buildTickerHTML()+'</div>';main.appendChild(ticker);
  // Province pill row
  var ppRow=div('');ppRow.style.cssText='padding:10px 22px 0;display:flex;align-items:center;gap:8px';ppRow.appendChild(provincePill(S.province));
  if(S.province){var clr=btn('✕ CLEAR','');clr.style.cssText='font-size:9px;color:#3a6070;background:none;border:none;letter-spacing:.5px;font-family:inherit';clr.addEventListener('click',function(){setProv(null);});ppRow.appendChild(clr);}
  main.appendChild(ppRow);
  // Content
  var mc=div('content');mc.id='mainContent';main.appendChild(mc);
  app.appendChild(main);
  renderSection();
  requestAnimationFrame(startTicker);
}

render();
</script>
</body>
</html>
