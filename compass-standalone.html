<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Angoalissar Compass</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#010810;--panel:rgba(0,14,28,.88);--br:rgba(0,220,255,.13);--brh:rgba(0,220,255,.5);--tx:#e0f7ff;--mid:#7aacbc;--dim:#3a6070;--c:#00e5ff;--cd:#00b8cc;--g:#00ff88;--a:#ffaa00;--r:#ff3b5c;--sb:rgba(0,5,14,.97);--tb:rgba(1,8,20,.93);--f:'IBM Plex Mono','Courier New',monospace}
body.light{--bg:#eef2f7;--panel:rgba(255,255,255,.93);--br:rgba(0,100,180,.14);--brh:rgba(0,100,180,.5);--tx:#0a1628;--mid:#2a4a6a;--dim:#6a8aaa;--c:#0055cc;--cd:#0044aa;--g:#007744;--a:#cc7700;--r:#cc2244;--sb:rgba(232,240,252,.98);--tb:rgba(232,240,252,.96)}
body.neon{--bg:#000512;--panel:rgba(10,0,28,.9);--br:rgba(200,0,255,.18);--brh:rgba(200,0,255,.6);--tx:#f0d0ff;--mid:#bb88cc;--dim:#664466;--c:#dd00ff;--cd:#aa00cc;--g:#00ffaa;--a:#ffcc00;--r:#ff2255;--sb:rgba(8,0,20,.98);--tb:rgba(5,0,15,.96)}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--c);border-radius:2px;opacity:.4}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease}
.panel{background:var(--panel);border:1px solid var(--br);border-radius:12px;backdrop-filter:blur(14px)}
button{cursor:pointer;font-family:var(--f);transition:opacity .15s}
button:hover{opacity:.82}
input:focus,select:focus{outline:none;border-color:var(--c)!important}
select option{background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh;position:relative;z-index:1}
.sbr{width:220px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--sb);border-right:1px solid var(--br);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s,background .25s;z-index:10}
.sbr.col{width:58px}
main{flex:1;min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;background:var(--tb);backdrop-filter:blur(16px);border-bottom:1px solid var(--br);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;transition:background .25s}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.content{padding:16px 20px 60px}
.ticker{overflow:hidden;border-top:1px solid var(--br);border-bottom:1px solid var(--br);height:26px;display:flex;align-items:center;background:var(--sb)}
.ticker-inner{display:flex;white-space:nowrap}
.nbtn{width:100%;display:flex;align-items:center;gap:9px;padding:10px 14px;background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--dim);font-size:11px;font-family:var(--f);letter-spacing:.5px;position:relative;transition:all .12s}
.nbtn.act{background:rgba(0,229,255,.08);border-left-color:var(--c);color:var(--c)}
.nbtn.col{justify-content:center;padding:10px 0}
.tbtn{padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--f);border:1px solid var(--br);background:transparent;color:var(--dim);letter-spacing:.5px;transition:all .15s}
.tbtn.act{border-color:var(--c);background:rgba(0,229,255,.12);color:var(--c)}
table{width:100%;border-collapse:collapse}
th{padding:7px 12px;text-align:left;color:var(--dim);font-weight:700;font-size:9px;letter-spacing:1px;background:rgba(0,229,255,.05)}
td{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--br);color:var(--tx)}
.ppill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.mbox{padding:24px;width:100%}
#sp{position:fixed;top:0;right:-440px;width:420px;height:100vh;z-index:900;overflow-y:auto;transition:right .28s cubic-bezier(.4,0,.2,1);background:var(--sb);border-left:1px solid var(--brh);display:flex;flex-direction:column}
#sp.open{right:0}
.sp-head{padding:14px 18px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--sb);z-index:1;flex-shrink:0}
.sp-body{padding:18px;flex:1;overflow-y:auto}
.news-card{cursor:pointer;transition:border-color .15s}
.news-card:hover{border-color:var(--c)!important}
.mob-btn{display:none}
.inp{width:100%;background:var(--panel);border:1px solid var(--br);border-radius:8px;padding:8px 11px;color:var(--tx);font-size:13px;font-weight:700;font-family:var(--f)}
.inp:focus{border-color:var(--c)}
.lbl{font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;display:block}
@media(max-width:768px){.sbr{display:none!important}.mob-btn{display:flex!important}.g2{grid-template-columns:1fr!important}.g3{grid-template-columns:1fr!important}.kgrid{grid-template-columns:repeat(2,1fr)!important}#sp{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<!-- Side panel — close wired immediately -->
<div id="sp">
  <div class="sp-head">
    <span id="sp-title" style="font-size:12px;font-weight:700;color:var(--tx)">Article</span>
    <button id="sp-close" style="background:none;border:1px solid var(--br);border-radius:8px;padding:5px 14px;color:var(--tx);font-size:12px;font-weight:700">✕ Close</button>
  </div>
  <div class="sp-body" id="sp-body"></div>
</div>

<script>
// ── Close panel — wired before anything else ──────────────────────────────
document.getElementById('sp-close').onclick = function(){ document.getElementById('sp').classList.remove('open'); };
document.getElementById('sp').addEventListener('click', function(e){ if(e.target === this) this.classList.remove('open'); });

// ── COMMODITY CONFIG ──────────────────────────────────────────────────────
// All manual entry, saved to localStorage. No random data.
var DEFAULT_COMMODITIES = [
  {id:'wheat',    name:'Wheat Flour', unit:'MT', origins:['Black Sea','US Gulf','EU'],    defaultOrigin:'Black Sea'},
  {id:'rice',     name:'Rice',        unit:'MT', origins:['Thailand','Vietnam','India','Pakistan'], defaultOrigin:'Thailand'},
  {id:'sugar',    name:'Sugar',       unit:'MT', origins:['Brazil','Thailand','EU'],       defaultOrigin:'Brazil'},
  {id:'maize',    name:'Maize',       unit:'MT', origins:['Black Sea','Brazil','US Gulf'], defaultOrigin:'Black Sea'},
  {id:'oil',      name:'Sunflower Oil',unit:'MT',origins:['Black Sea','EU'],              defaultOrigin:'Black Sea'},
  {id:'beans',    name:'Beans',       unit:'MT', origins:['Argentina','US','China'],       defaultOrigin:'Argentina'},
  {id:'soybean',  name:'Soybean',     unit:'MT', origins:['Brazil','Argentina','US Gulf'], defaultOrigin:'Brazil'},
  {id:'palmoil',  name:'Palm Oil',    unit:'MT', origins:['Rotterdam','Malaysia','Indonesia'], defaultOrigin:'Rotterdam'},
];

// Default CIF formula per commodity (all adjustable)
var DEFAULT_CIF_PARAMS = {
  freight:   55,   // USD/MT — sea freight to Luanda
  insurance: 1.5,  // % of (FOB+freight)
  customs:   8.0,  // % of CIF USD value
  port:      12,   // USD/MT port handling Luanda
  other:     5,    // USD/MT other costs
  fxRate:    878,  // USD → AOA
};

function loadDB(){
  var db = {};
  try{ db = JSON.parse(localStorage.getItem('compass_db')||'{}'); }catch(e){}
  // Ensure all keys exist
  if(!db.commodities) db.commodities = {};
  if(!db.cifParams)   db.cifParams   = {};
  if(!db.priceHistory) db.priceHistory = {};
  DEFAULT_COMMODITIES.forEach(function(c){
    if(!db.commodities[c.id]) db.commodities[c.id] = {
      fobUSD: 0, origin: c.defaultOrigin, date: '', notes: '',
      apiFetch: false, apiPrice: 0
    };
    if(!db.cifParams[c.id]) db.cifParams[c.id] = Object.assign({}, DEFAULT_CIF_PARAMS);
    if(!db.priceHistory[c.id]) db.priceHistory[c.id] = [];
  });
  if(!db.angolaProvincePrices) db.angolaProvincePrices = {};
  if(!db.briefings) db.briefings = [];
  if(!db.settings)  db.settings  = {copilotMemory:10, devilTone:'moderate', briefingEnabled:false, briefingTime:'07:30'};
  if(!db.newsFeeds) db.newsFeeds = DEFAULT_FEEDS;
  return db;
}

function saveDB(){ try{ localStorage.setItem('compass_db', JSON.stringify(DB)); }catch(e){ alert('Storage error: '+e.message); } }

// CIF calculation
function calcCIF(fobUSD, params){
  var fob    = parseFloat(fobUSD)||0;
  var p      = params;
  var freight   = parseFloat(p.freight)||0;
  var cfr       = fob + freight;
  var insurance = cfr * ((parseFloat(p.insurance)||0)/100);
  var cifUSD    = cfr + insurance;
  var port      = parseFloat(p.port)||0;
  var other     = parseFloat(p.other)||0;
  var customsUSD = cifUSD * ((parseFloat(p.customs)||0)/100);
  var totalUSD  = cifUSD + customsUSD + port + other;
  var cifAOA    = totalUSD * (parseFloat(p.fxRate)||878);
  return {cfr:cfr, insurance:insurance, cifUSD:cifUSD, customsUSD:customsUSD, port:port, other:other, totalUSD:totalUSD, cifAOA:cifAOA};
}

// ── RSS FEEDS ──────────────────────────────────────────────────────────────
var DEFAULT_FEEDS = [
  {name:'Correio da Kianda', url:'https://correiokianda.info/feed/',            cat:'angola', on:true},
  {name:'Noticias de Angola', url:'https://noticiasdeangola.co.ao/feed/',       cat:'angola', on:true},
  {name:'Folha 8',            url:'https://jornalf8.net/feed/',                 cat:'angola', on:true},
  {name:'Maka Angola',        url:'https://www.makaangola.org/feed/',           cat:'angola', on:false},
  {name:'BBC Africa',         url:'https://feeds.bbci.co.uk/news/world/africa/rss.xml', cat:'africa', on:true},
  {name:'AllAfrica',          url:'https://allafrica.com/tools/headlines/rdf/africa/headlines.rdf', cat:'africa', on:false},
  {name:'NYT Africa',         url:'https://rss.nytimes.com/services/xml/rss/nyt/Africa.xml', cat:'world', on:false},
  {name:'BBC World',          url:'https://feeds.bbci.co.uk/news/world/rss.xml', cat:'world', on:false},
];
var RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';

// ── STATE ──────────────────────────────────────────────────────────────────
var DB;
try{ DB = loadDB(); }catch(e){ DB = loadDB(); }

var S = {
  section: 'overview',
  province: null,
  collapsed: false,
  theme: 'dark',
  selCommodity: DEFAULT_COMMODITIES[0].id,
  copilotTab: 'chat',
  copilotTone: 'moderate',
  copilotHorizon: '30 days',
  msgs: [],
  copilotLoading: false,
  newsCat: null,
  newsSearch: '',
  newsDateFrom: '',
  newsDateTo: '',
  articles: [],
  newsLoading: false,
  briefingLoading: false,
  briefingDraft: null,   // {summary, articles:[{headline,url,source}]}
  cifEditMode: false,
  fxRates: [{pair:'USD/AOA',rate:878,chg:.3},{pair:'EUR/AOA',rate:953,chg:-.8},{pair:'CNY/AOA',rate:121,chg:.1},{pair:'GBP/AOA',rate:1112,chg:1.2},{pair:'BRL/AOA',rate:159,chg:-.4}],
};

try{ S.theme = localStorage.getItem('compass_theme')||'dark'; }catch(e){}
try{ S.province = localStorage.getItem('compass_province')||null; }catch(e){}
applyTheme(S.theme, false);

function applyTheme(t, rerender){
  S.theme = t;
  document.body.className = t==='light'?'light':t==='neon'?'neon':'';
  try{ localStorage.setItem('compass_theme', t); }catch(e){}
  if(rerender) render();
}

// FX live simulation
setInterval(function(){
  S.fxRates = S.fxRates.map(function(r){ return {pair:r.pair, rate:parseFloat((r.rate+(Math.random()-.5)*.9).toFixed(1)), chg:parseFloat((r.chg+(Math.random()-.5)*.1).toFixed(2))}; });
  var ti = document.querySelector('.ticker-inner');
  if(ti) ti.innerHTML = tickerHTML();
}, 2800);

// ── HELPERS ────────────────────────────────────────────────────────────────
var fmt  = function(n,dp){ return (n||0).toLocaleString('en-US',{maximumFractionDigits:dp||0}); };
var fmtM = function(n){ return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':fmt(n); };
var fmtUSD = function(n){ return '$'+fmt(n,2); };

function el(tag, style, html){
  var e = document.createElement(tag);
  if(style) e.style.cssText = style;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function div(style, html){ return el('div', style, html); }
function btn(text, style, onclick){
  var b = el('button', style);
  b.textContent = text;
  if(onclick) b.onclick = onclick;
  return b;
}
function inp(type, val, style, cb){
  var i = el('input', style);
  i.type = type;
  if(val !== undefined && val !== null) i.value = val;
  if(cb) i.addEventListener('input', cb);
  return i;
}
function lbl(text){ var l = el('label', 'font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;display:block'); l.textContent = text; return l; }

function pill(prov){
  var color = prov ? 'var(--a)' : 'var(--cd)';
  var d = div('display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;background:'+color+'15;border:1px solid '+color+'30;color:'+color);
  d.textContent = '\uD83D\uDCCD '+(prov ? prov.toUpperCase() : 'ALL PROVINCES');
  return d;
}

function secHead(title, sub, prov){
  var d = div('margin-bottom:18px');
  var h = el('h2','font-size:17px;font-weight:900;color:var(--tx);letter-spacing:.5px'); h.textContent = title; d.appendChild(h);
  if(sub){ var s = el('p','font-size:11px;color:var(--dim);margin-top:3px'); s.textContent = sub; d.appendChild(s); }
  var pw = div('margin-top:7px'); pw.appendChild(pill(prov)); d.appendChild(pw);
  return d;
}

function kpiCard(label, value, sub, trend, accent){
  var c = div('','<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,'+accent+',transparent);opacity:.6"></div>'
    +'<div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">'+label+'</div>'
    +'<div style="font-size:20px;font-weight:800;color:var(--tx)">'+value+'</div>'
    +(sub?'<div style="font-size:10px;color:var(--dim);margin-top:3px">'+sub+'</div>':'')
    +(trend!==undefined?'<div style="font-size:11px;font-weight:700;margin-top:3px;color:'+(trend>0?'var(--g)':trend<0?'var(--r)':'var(--dim)')+'"> '+(trend>0?'▲':trend<0?'▼':'—')+Math.abs(trend).toFixed(1)+'%</div>':''));
  c.className = 'panel'; c.style.cssText = 'padding:14px 16px;position:relative;overflow:hidden';
  return c;
}

// SVG line chart
function svgLine(points, color, w, h){
  w=w||300; h=h||80;
  if(!points||points.length<2) return '<div style="height:'+h+'px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10px">No history yet — enter prices to build chart</div>';
  var vals = points.map(function(p){ return p.price; });
  var mn = Math.min.apply(null,vals), mx = Math.max.apply(null,vals), rng = mx-mn||1;
  var pts = vals.map(function(v,i){ return (i/(vals.length-1)*w)+','+(h-(v-mn)/rng*h); }).join(' L');
  var id = 'lg'+Math.random().toString(36).slice(2,6);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="'+color+'" stop-opacity=".2"/><stop offset="95%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="M'+pts+' L'+w+','+h+' L0,'+h+' Z" fill="url(#'+id+')" />'
    +'<path d="M'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>'
    +'<circle cx="'+(vals.length-1)/(vals.length-1)*w+'" cy="'+(h-(vals[vals.length-1]-mn)/rng*h)+'" r="4" fill="'+color+'"/>'
    +'</svg>';
}

// ── SECTIONS ──────────────────────────────────────────────────────────────

// OVERVIEW
function renderOverview(){
  var d = div(''); d.className='fade';
  d.appendChild(secHead('Overview', 'Commercial intelligence dashboard', S.province));

  var kg = div(''); kg.className='kgrid';
  var pricesEntered = DEFAULT_COMMODITIES.filter(function(c){ return parseFloat(DB.commodities[c.id].fobUSD)>0; }).length;
  kg.appendChild(kpiCard('Commodities Tracked', DEFAULT_COMMODITIES.length+'', '', undefined, 'var(--c)'));
  kg.appendChild(kpiCard('Prices Entered', pricesEntered+'/'+DEFAULT_COMMODITIES.length, 'FOB entries', undefined, 'var(--g)'));
  kg.appendChild(kpiCard('USD/AOA Rate', fmt(DB.cifParams[DEFAULT_COMMODITIES[0].id].fxRate||878), 'Exchange rate', undefined, 'var(--a)'));
  kg.appendChild(kpiCard('Briefings Saved', DB.briefings.length+'', 'With sources', undefined, 'var(--c)'));
  kg.appendChild(kpiCard('News Articles', S.articles.length+'', S.articles.length?'Loaded':'Click News → Load', undefined, 'var(--mid)'));
  kg.appendChild(kpiCard('Province Scope', S.province||'All Angola', '', undefined, 'var(--c)'));
  d.appendChild(kg);

  // Commodity summary table
  var tp = div(''); tp.className='panel'; tp.style.overflow='hidden';
  tp.innerHTML='<div style="padding:9px 14px;border-bottom:1px solid var(--br);font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px">COMMODITY OVERVIEW — FOB & CIF LUANDA SNAPSHOT</div>';
  var tbl = document.createElement('table');
  tbl.innerHTML = '<thead><tr><th>Commodity</th><th>Origin</th><th>FOB (USD/MT)</th><th>CIF Luanda (USD/MT)</th><th>CIF Luanda (AOA/MT)</th><th>Updated</th></tr></thead>';
  var tb = document.createElement('tbody');
  DEFAULT_COMMODITIES.forEach(function(c){
    var cd = DB.commodities[c.id];
    var cp = DB.cifParams[c.id];
    var fob = parseFloat(cd.fobUSD)||0;
    var cif = fob>0 ? calcCIF(fob, cp) : null;
    var tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.innerHTML = '<td style="font-weight:700;color:var(--tx)">'+c.name+'</td>'
      +'<td style="color:var(--mid);font-size:11px">'+cd.origin+'</td>'
      +'<td style="color:var(--a);font-weight:800">'+(fob>0?fmtUSD(fob):'<span style="color:var(--dim)">—</span>')+'</td>'
      +'<td style="color:var(--c);font-weight:800">'+(cif?fmtUSD(cif.cifUSD):'<span style="color:var(--dim)">—</span>')+'</td>'
      +'<td style="color:var(--g);font-weight:800">'+(cif?fmt(cif.cifAOA):'<span style="color:var(--dim)">—</span>')+'</td>'
      +'<td style="color:var(--dim);font-size:10px">'+(cd.date||'Not set')+'</td>';
    tr.onclick = function(){ S.section='commodities'; S.selCommodity=c.id; renderSection(); };
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); tp.appendChild(tbl); d.appendChild(tp);

  // Latest news
  if(S.articles.length){
    var np = div(''); np.className='panel'; np.style.cssText='padding:14px;margin-top:14px';
    np.innerHTML='<div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;margin-bottom:10px">LATEST INTELLIGENCE</div>';
    S.articles.slice(0,5).forEach(function(n){
      var row = div('display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;cursor:pointer');
      var dot = div('width:5px;height:5px;border-radius:50%;background:var(--c);margin-top:4px;flex-shrink:0'); row.appendChild(dot);
      var txt = div('');
      var hl = div('font-size:11px;color:var(--mid);line-height:1.4;margin-bottom:2px'); hl.textContent = (n.headline||'').slice(0,85)+'…';
      var src = div('font-size:9px;color:var(--dim)'); src.textContent = n.source+' · '+n.date;
      txt.appendChild(hl); txt.appendChild(src); row.appendChild(txt);
      row.onclick = function(){ openArticle(n); };
      np.appendChild(row);
    });
    d.appendChild(np);
  }
  return d;
}

// COMMODITIES — FOB + CIF
function renderCommodities(){
  var d = div(''); d.className='fade';
  d.appendChild(secHead('Commodities — World Prices', 'FOB origin + CIF Luanda calculation. All data entered manually.', S.province));

  // Commodity tabs
  var tabs = div('display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px');
  DEFAULT_COMMODITIES.forEach(function(c){
    var b = el('button',''); b.className='tbtn'+(S.selCommodity===c.id?' act':'');
    b.textContent = c.name;
    b.onclick = function(){ S.selCommodity=c.id; renderSection(); };
    tabs.appendChild(b);
  });
  d.appendChild(tabs);

  var comm = DEFAULT_COMMODITIES.find(function(c){ return c.id===S.selCommodity; });
  var cd   = DB.commodities[S.selCommodity];
  var cp   = DB.cifParams[S.selCommodity];
  var fob  = parseFloat(cd.fobUSD)||0;
  var cif  = fob>0 ? calcCIF(fob, cp) : null;

// LANDED COST
function renderLandedCost(){
  var d = div(''); d.className='fade';
  d.appendChild(secHead('Landed Cost Simulator', 'Quick scenario tool — separate from commodity records', S.province));
  var stored = DB.landedScenario || {baseCostUSD:18.5,freightUSD:2.8,customsDuty:10,fxRate:878,otherCosts:500,sellingPrice:24500};
  DB.landedScenario = stored;
  var p = stored;
  var cif=(parseFloat(p.baseCostUSD)||0+parseFloat(p.freightUSD)||0)*(parseFloat(p.fxRate)||878);
  var baseFOB=(parseFloat(p.baseCostUSD)||0)*(parseFloat(p.fxRate)||878);
  var freightAOA=(parseFloat(p.freightUSD)||0)*(parseFloat(p.fxRate)||878);
  var duty=cif*(parseFloat(p.customsDuty)||0)/100;
  var landed=Math.round(baseFOB+freightAOA+duty+(parseFloat(p.otherCosts)||0));
  var margin=parseFloat(((1-landed/(parseFloat(p.sellingPrice)||1))*100).toFixed(2));
  var mc=margin<0?'var(--r)':margin<5?'var(--a)':'var(--g)';
  var g2=div(''); g2.className='g2';
  var ip=div(''); ip.className='panel'; ip.style.padding='20px';

  [['Base Cost','baseCostUSD',.1,'USD'],['Freight','freightUSD',.1,'USD'],['Customs Duty %','customsDuty',.5,'%'],['FX Rate USD/AOA','fxRate',1,''],['Other Costs','otherCosts',100,'AOA'],['Selling Price','sellingPrice',100,'AOA']].forEach(function(fi){
    var row=div('margin-bottom:13px');
    row.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1px">'+fi[0].toUpperCase()+'</span><span style="font-size:9px;color:var(--c)">'+fi[3]+'</span></div>';
    var i=inp('number',p[fi[1]],'width:100%;background:var(--panel);border:1px solid var(--br);border-radius:8px;padding:8px 12px;color:var(--a);font-size:14px;font-weight:800;font-family:var(--f)',function(e){DB.landedScenario[fi[1]]=parseFloat(e.target.value)||0;saveDB();renderSection();});
    i.step=fi[2]; row.appendChild(i); ip.appendChild(row);
  });
  g2.appendChild(ip);
  var rp=div('display:flex;flex-direction:column;gap:12px');
  var calc=div(''); calc.className='panel'; calc.style.cssText='padding:17px;border:1px solid var(--brh)';
  calc.innerHTML='<div style="font-size:9px;color:var(--c);font-weight:700;letter-spacing:1.5px;margin-bottom:13px">RESULT</div>';
  [['Base Cost (AOA)',fmt(Math.round(baseFOB))],['Freight (AOA)',fmt(Math.round(freightAOA))],['Customs Duty (AOA)',fmt(Math.round(duty))],['Other Costs (AOA)',fmt(parseFloat(p.otherCosts)||0)],['LANDED COST (AOA)',fmt(landed),true],['Selling Price (AOA)',fmt(parseFloat(p.sellingPrice)||0)]].forEach(function(ri){
    var row=div('display:flex;justify-content:space-between;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--br)');
    row.innerHTML='<span style="font-size:11px;color:'+(ri[2]?'var(--tx)':'var(--dim)')+';font-weight:'+(ri[2]?700:400)+'">'+ri[0]+'</span><span style="font-size:13px;color:'+(ri[2]?'var(--c)':'var(--tx)')+';font-weight:800">'+ri[1]+'</span>';
    calc.appendChild(row);
  });
  rp.appendChild(calc);
  var mp=div(''); mp.className='panel'; mp.style.cssText='padding:20px;text-align:center;border:1px solid '+mc.replace('var(--','').replace(')','')+'40';

  rp.appendChild(mp); g2.appendChild(rp); d.appendChild(g2);
  return d;

function fetchFeeds(){
  var active=DB.newsFeeds.filter(function(f){return f.on;});
  if(!active.length){alert('No feeds enabled. Click Manage Sources.');return;}
  S.newsLoading=true;S.articles=[];renderSection();
  var pending=active.length,collected=[];
  active.forEach(function(feed){
    fetch(RSS_PROXY+encodeURIComponent(feed.url)).then(function(r){return r.json();}).then(function(data){
      if(data.items){data.items.slice(0,8).forEach(function(item){collected.push({id:Math.random().toString(36).slice(2),headline:(item.title||'').trim(),source:feed.name,url:item.link||'',date:(item.pubDate||'').slice(0,10)||new Date().toISOString().slice(0,10),description:item.description?item.description.replace(/<[^>]*>/g,'').slice(0,300):'',cat:feed.cat});});}
    }).catch(function(){}).finally(function(){pending--;if(pending===0){S.articles=collected.sort(function(a,b){return b.date.localeCompare(a.date);});S.newsLoading=false;if(!S.articles.length)alert('Feeds loaded but no articles found. Check if feeds are active.');renderSection();}});
  });
}

  var existing=document.getElementById('feedMgr');if(existing)existing.remove();
  var mb=div('');mb.id='feedMgr';mb.className='modal';
  var box=div('');box.className='panel mbox';box.style.cssText='max-width:620px;max-height:85vh;overflow-y:auto;padding:24px';
  var head=div('display:flex;justify-content:space-between;align-items:center;margin-bottom:16px');
  head.innerHTML='<div style="font-size:14px;font-weight:900;color:var(--tx)">RSS Source Manager</div>';
  var closeBtn=btn('✕ Done','background:none;border:1px solid var(--br);border-radius:8px;padding:5px 14px;color:var(--tx);font-size:12px;font-weight:700',function(){mb.remove();});
  head.appendChild(closeBtn);box.appendChild(head);
  box.innerHTML+='<div style="font-size:10px;color:var(--dim);margin-bottom:14px;line-height:1.5">Toggle feeds on/off. Add custom RSS URLs. Changes save automatically.</div>';
  DB.newsFeeds.forEach(function(f,i){
    var row=div('display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--br)');
    var tog=div('width:38px;height:20px;border-radius:10px;cursor:pointer;flex-shrink:0;position:relative;background:'+(f.on?'var(--c)':'var(--br)')+';transition:background .2s');
    var dot=div('position:absolute;top:2px;left:'+(f.on?20:2)+'px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:left .2s');
    tog.appendChild(dot);tog.onclick=function(){DB.newsFeeds[i].on=!DB.newsFeeds[i].on;saveDB();openFeedManager();};row.appendChild(tog);
    var info=div('flex:1');info.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--tx)">'+f.name+'</div><div style="font-size:9px;color:var(--dim)">'+f.url.slice(0,60)+(f.url.length>60?'…':'')+'</div>';row.appendChild(info);
    var cat=div('font-size:9px;padding:2px 6px;border-radius:4px;background:var(--c)15;color:var(--c);flex-shrink:0');cat.textContent=f.cat;row.appendChild(cat);
    var del=btn('✕','font-size:12px;background:none;border:none;color:var(--r);padding:0 4px',function(){DB.newsFeeds.splice(i,1);saveDB();openFeedManager();});row.appendChild(del);
    box.appendChild(row);
  });
  box.innerHTML+='<div style="margin-top:16px;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:1px;margin-bottom:8px">ADD NEW FEED</div>';
  var ni=inp('text','','width:100%;background:var(--panel);border:1px solid var(--br);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px;font-family:var(--f);margin-bottom:6px',null);ni.placeholder='Feed name (e.g. ANGOP)';box.appendChild(ni);
  var ui=inp('text','','width:100%;background:var(--panel);border:1px solid var(--br);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px;font-family:var(--f);margin-bottom:6px',null);ui.placeholder='RSS URL';box.appendChild(ui);
  var cs=document.createElement('select');cs.style.cssText='background:var(--panel);border:1px solid var(--br);border-radius:6px;padding:7px 10px;color:var(--tx);font-size:12px;font-family:var(--f);width:100%;margin-bottom:10px';['angola','africa','world'].forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});box.appendChild(cs);
  var ab=btn('+ Add Feed','padding:8px 18px;background:var(--c);color:var(--bg);border:none;border-radius:6px;font-size:11px;font-weight:800',function(){if(!ni.value.trim()||!ui.value.trim())return;DB.newsFeeds.push({name:ni.value.trim(),url:ui.value.trim(),cat:cs.value,on:true});saveDB();openFeedManager();});
  box.appendChild(ab);mb.appendChild(box);mb.onclick=function(e){if(e.target===mb)mb.remove();};document.body.appendChild(mb);
}

function openArticle(art){
  document.getElementById('sp-title').textContent=art.source;
  var body=document.getElementById('sp-body');body.innerHTML='';
  body.innerHTML='<div style="font-size:9px;color:var(--c);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">'+art.cat+' · '+art.date+'</div>';
  var title=el('h3','font-size:15px;font-weight:800;color:var(--tx);line-height:1.5;margin-bottom:12px');title.textContent=art.headline;body.appendChild(title);
  if(art.description){var desc=el('p','font-size:12px;color:var(--mid);line-height:1.7;margin-bottom:16px;border-top:1px solid var(--br);padding-top:12px');desc.textContent=art.description;body.appendChild(desc);}
  if(art.url){var ob=btn('🔗 Read Full Article at '+art.source,'padding:12px 16px;background:var(--c);color:var(--bg);border:none;border-radius:8px;font-size:11px;font-weight:800;width:100%;text-align:left;margin-bottom:10px',function(){window.open(art.url,'_blank');});body.appendChild(ob);}
  var wa=btn('📲 Share on WhatsApp','padding:12px 16px;background:#25D366;color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:800;width:100%;text-align:left',function(){window.open('https://wa.me/?text='+encodeURIComponent(art.headline+(art.url?' — '+art.url:'')),'_blank');});
  body.appendChild(wa);
  document.getElementById('sp').classList.add('open');
}

// ── SIDEBAR ────────────────────────────────────────────────────────────────
var NAV=[{k:'overview',e:'⬛',l:'Overview'},{k:'commodities',e:'📈',l:'Commodities'},{k:'landed',e:'📦',l:'Landed Cost'},{k:'copilot',e:'🧠',l:'Copilot AI',badge:'AI'},{k:'briefings',e:'📋',l:'Briefings'},{k:'news',e:'📰',l:'News'},{k:'settings',e:'⚙️',l:'Settings'}];

function buildSidebar(col){
  var sb=div('');sb.className='sbr'+(col?' col':'');
  var logo=div(col?'padding:14px 0;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--br)':'padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--br)');
  if(!col){var lt=div('');lt.innerHTML='<div style="font-size:13px;font-weight:900;color:var(--c);letter-spacing:3px">COMPASS</div><div style="font-size:8px;color:var(--dim);font-weight:700;letter-spacing:2px">ANGOALISSAR · v3</div>';logo.appendChild(lt);}
  var tb=btn('☰','background:none;border:none;color:var(--dim);font-size:18px',function(){S.collapsed=!S.collapsed;render();});logo.appendChild(tb);sb.appendChild(logo);
  if(!col){var pp=div('padding:8px 12px;border-bottom:1px solid var(--br)');pp.appendChild(pill(S.province));sb.appendChild(pp);}
  var nav=div('flex:1;padding-top:6px');
  NAV.forEach(function(item){
    var isA=S.section===item.k;
    var nb=el('button','');nb.className='nbtn'+(isA?' act':'')+(col?' col':'');
    if(isA){var bar=div('position:absolute;left:2px;top:18%;bottom:18%;width:2px;background:var(--c);border-radius:1px');nb.appendChild(bar);}
    var ico=div('font-size:15px');ico.textContent=item.e;nb.appendChild(ico);
    if(!col){var lbl2=div('font-size:11px;font-weight:'+(isA?700:400)+';color:'+(isA?'var(--c)':'var(--dim)')+';flex:1;text-align:left;letter-spacing:.5px');lbl2.textContent=item.l;nb.appendChild(lbl2);}
    if(!col&&item.badge){var bdg=div('font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;background:var(--c);color:var(--bg);letter-spacing:1px');bdg.textContent=item.badge;nb.appendChild(bdg);}
    nb.onclick=function(){S.section=item.k;renderSection();var mob=document.getElementById('mobSB');if(mob)mob.remove();};
    nav.appendChild(nb);
  });
  sb.appendChild(nav);
  if(!col){
    var feed=div('border-top:1px solid var(--br);padding:10px 12px');
    var fh=div('font-size:8px;color:var(--dim);font-weight:800;margin-bottom:8px;letter-spacing:2px');fh.textContent='◉ LIVE · '+(S.province?S.province.toUpperCase():'ALL');feed.appendChild(fh);
    S.articles.slice(0,3).forEach(function(n){var row=div('display:flex;gap:6px;margin-bottom:8px;align-items:flex-start');var dot=div('width:4px;height:4px;border-radius:50%;background:var(--c);margin-top:4px;flex-shrink:0');row.appendChild(dot);var nt=div('font-size:9px;color:var(--dim);line-height:1.4');nt.textContent=(n.headline||'').slice(0,52)+'…';row.appendChild(nt);feed.appendChild(row);});
    if(!S.articles.length){var nl=div('font-size:9px;color:var(--dim)');nl.textContent='News → Refresh Feeds';feed.appendChild(nl);}
    sb.appendChild(feed);
  }
  return sb;
}

// ── Ticker ─────────────────────────────────────────────────────────────────
function tickerHTML(){return S.fxRates.concat(S.fxRates).map(function(r){return '<span style="padding:0 18px;font-size:10px;border-right:1px solid var(--br);display:inline-flex;align-items:center;gap:7px"><span style="color:var(--dim);font-weight:700">'+r.pair+'</span><span style="color:var(--tx);font-weight:800">'+r.rate.toFixed(1)+'</span><span style="color:'+(r.chg>=0?'var(--g)':'var(--r)')+';font-size:9px">'+(r.chg>=0?'▲':'▼')+Math.abs(r.chg).toFixed(1)+'</span></span>';}).join('');}
var tOff=0,tRaf;
function startTicker(){if(tRaf)cancelAnimationFrame(tRaf);function run(){var inner=document.querySelector('.ticker-inner');if(inner){tOff-=.5;if(tOff<-inner.scrollWidth/2)tOff=0;inner.style.transform='translateX('+tOff+'px)';}tRaf=requestAnimationFrame(run);}tRaf=requestAnimationFrame(run);}

// ── Province helpers ───────────────────────────────────────────────────────
function setProv(p){S.province=p;try{p?localStorage.setItem('compass_province',p):localStorage.removeItem('compass_province');}catch(e){}render();}

function buildProvDD(parent){
  var existing=document.getElementById('provDD');if(existing){existing.remove();return;}
  var PROVINCES=['Luanda','Benguela','Huila','Cabinda','Cuanza Norte','Cuanza Sul','Malanje','Lunda Norte','Namibe','Uige','Huambo','Bie','Cunene','Moxico','Zaire','Bengo','Lunda Sul','Cuando Cubango'];
  var dd=div('position:absolute;top:110%;right:0;width:200px;z-index:200;padding:6px;max-height:260px;overflow-y:auto;border:1px solid var(--brh);box-shadow:0 8px 32px rgba(0,0,0,.6)');dd.id='provDD';dd.className='panel';
  var allb=btn('All Provinces','width:100%;padding:7px 10px;border-radius:6px;background:'+(!S.province?'var(--c)15':'transparent')+';border:none;color:'+(!S.province?'var(--c)':'var(--dim)')+';text-align:left;font-size:11px;font-weight:'+(!S.province?700:400),function(e){e.stopPropagation();setProv(null);dd.remove();});dd.appendChild(allb);
  PROVINCES.forEach(function(p){var pb=btn(p,'width:100%;padding:6px 10px;border-radius:6px;background:'+(S.province===p?'var(--c)12':'transparent')+';border:none;color:'+(S.province===p?'var(--c)':'var(--dim)')+';text-align:left;font-size:10px;font-weight:'+(S.province===p?700:400),function(e){e.stopPropagation();setProv(p);dd.remove();});dd.appendChild(pb);});
  parent.style.position='relative';parent.appendChild(dd);
  setTimeout(function(){document.addEventListener('click',function rm(){dd.remove();document.removeEventListener('click',rm);});},10);
}

// ── Main render ────────────────────────────────────────────────────────────
function renderSection(){
  var mc=document.getElementById('mc');if(!mc)return;mc.innerHTML='';
  var fns={overview:renderOverview,commodities:renderCommodities,landed:renderLandedCost,copilot:renderCopilot,briefings:renderBriefings,news:renderNews,settings:renderSettings};
  var fn=fns[S.section];if(fn)mc.appendChild(fn());
}

function render(){
  var app=document.getElementById('app');app.innerHTML='';
  var sbc=div('position:relative;z-index:10;display:none');sbc.className='sbc';sbc.appendChild(buildSidebar(S.collapsed));app.appendChild(sbc);
  var main=document.createElement('main');
  var topbar=div('');topbar.className='topbar';
  var tl=div('display:flex;align-items:center;gap:10px');
  var mob=btn('☰','background:none;border:none;color:var(--c);font-size:20px;display:none',function(){var existing=document.getElementById('mobSB');if(existing){existing.remove();return;}var ov=div('position:fixed;inset:0;z-index:200');ov.id='mobSB';var bg=div('position:absolute;inset:0;background:rgba(0,0,0,.75)');bg.onclick=function(){ov.remove();};var msb=buildSidebar(false);msb.style.cssText='position:absolute;left:0;top:0;bottom:0;display:flex!important';ov.appendChild(bg);ov.appendChild(msb);document.body.appendChild(ov);});mob.className='mob-btn';tl.appendChild(mob);
  var secName=NAV.find(function(n){return n.k===S.section;});
  var si=div('');si.innerHTML='<div style="font-size:13px;font-weight:800;color:var(--tx);letter-spacing:1px">'+((secName&&secName.l)||'').toUpperCase()+'</div><div style="font-size:9px;color:var(--dim);letter-spacing:1px">'+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div>';tl.appendChild(si);topbar.appendChild(tl);
  var tr=div('display:flex;gap:7px;align-items:center;flex-wrap:wrap');
  var thDiv=div('display:flex;gap:3px');[['dark','🌑'],['light','☀️'],['neon','🟣']].forEach(function(ti){var b=btn(ti[1],'padding:5px 8px;border-radius:6px;font-size:14px;background:'+(S.theme===ti[0]?'var(--c)':'var(--panel)')+';border:1px solid '+(S.theme===ti[0]?'var(--c)':'var(--br)'),function(){applyTheme(ti[0],true);});thDiv.appendChild(b);});tr.appendChild(thDiv);
  var pw=div('');pw.style.position='relative';var pb=btn('','display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--mid);font-size:10px',function(e){e.stopPropagation();buildProvDD(pw);});
  pb.innerHTML='📍 <span style="color:var(--tx);font-weight:700">'+(S.province||'ALL')+'</span> ▾';pw.appendChild(pb);tr.appendChild(pw);
  topbar.appendChild(tr);main.appendChild(topbar);
  var ticker=div('');ticker.className='ticker';ticker.innerHTML='<div class="ticker-inner" style="display:flex;white-space:nowrap">'+tickerHTML()+'</div>';main.appendChild(ticker);
  var ppRow=div('padding:10px 20px 0;display:flex;align-items:center;gap:8px');ppRow.appendChild(pill(S.province));
  if(S.province){var clr=btn('✕ Clear','background:none;border:none;color:var(--dim);font-size:9px',function(){setProv(null);});ppRow.appendChild(clr);}
  main.appendChild(ppRow);
  var mc=div('');mc.id='mc';mc.className='content';main.appendChild(mc);
  app.appendChild(main);
  var style=document.createElement('style');style.textContent='@media(min-width:769px){.sbc{display:block!important}.mob-btn{display:none!important}}';document.head.appendChild(style);
  renderSection();requestAnimationFrame(startTicker);
}

render();
</script>
</body>
</html>
