*{box-sizing:border-box;margin:0;padding:0}
:root{

}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(0,220,255,0.3);border-radius:2px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

input:focus,select:focus{outline:none;border-color:var(--c)!important;box-shadow:0 0 0 2px rgba(0,229,255,.1)}
button{cursor:pointer;transition:all .15s;font-family:var(--f)}
button:hover{opacity:.85}
input[type=number]::-webkit-inner-spin-button{opacity:.3}
select option{background:#010f1e;color:var(--tx)}
.panel{background:var(--panel);border:1px solid var(--br);border-radius:12px;backdrop-filter:blur(14px)}
.neon-text{text-shadow:0 0 12px var(--c),0 0 24px rgba(0,229,255,.18)}
.score-bar{height:4px;border-radius:2px;background:rgba(0,180,220,.1);overflow:hidden}
.score-fill{height:100%;border-radius:2px;transition:width .6s ease}
@media(max-width:768px){
  .sidebar{display:none!important}
  .mob-btn{display:flex!important}
  .grid-3{grid-template-columns:1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .kpi-grid{grid-template-columns:repeat(2,1fr)!important}
}

// ── Bloomberg BG ─────────────────────────────────────────────────────────────
(()=>{
  const c=document.getElementById('bg'),ctx=c.getContext('2d');
  let w,h,t=0,nodes=[];
  const resize=()=>{w=c.width=innerWidth;h=c.height=innerHeight;nodes=Array.from({length:14},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,p:Math.random()*Math.PI*2}))};
  resize();window.addEventListener('resize',resize);
  (function draw(){
    t+=.007;ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#010810';ctx.fillRect(0,0,w,h);
    const v=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.75);
    v.addColorStop(0,'rgba(0,20,42,0)');v.addColorStop(1,'rgba(0,0,8,.75)');
    ctx.fillStyle=v;ctx.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=46){ctx.strokeStyle=`rgba(0,220,255,${.03+Math.sin(x*.018+t*.4)*.013})`;ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(let y=0;y<h;y+=46){ctx.strokeStyle=`rgba(0,200,255,${.03+Math.sin(y*.018+t*.3)*.013})`;ctx.lineWidth=.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    const sy=((t*28)%(h+40))-20,sg=ctx.createLinearGradient(0,sy-3,0,sy+3);
    sg.addColorStop(0,'rgba(0,220,255,0)');sg.addColorStop(.5,'rgba(0,220,255,.05)');sg.addColorStop(1,'rgba(0,220,255,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,sy-3,w,6);
    [[0,0,w,h],[w*.35,0,w,h*.65],[0,h*.3,w*.7,h]].forEach(([x1,y1,x2,y2],i)=>{
      const bg=ctx.createLinearGradient(x1,y1,x2,y2);const a=.04+Math.sin(t+i)*.018;
      bg.addColorStop(0,'rgba(0,180,255,0)');bg.addColorStop(.5,`rgba(0,180,255,${a})`);bg.addColorStop(1,'rgba(0,180,255,0)');
      ctx.strokeStyle=bg;ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    });
    nodes.forEach(n=>{
      n.x+=n.vx;n.y+=n.vy;n.p+=.025;
      if(n.x<0||n.x>w)n.vx*=-1;if(n.y<0||n.y>h)n.vy*=-1;
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,22+Math.sin(n.p)*6);
      g.addColorStop(0,`rgba(0,220,255,${.25+Math.sin(n.p)*.12})`);g.addColorStop(1,'rgba(0,220,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,22,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(200,245,255,${.6+Math.sin(n.p)*.3})`;ctx.beginPath();ctx.arc(n.x,n.y,1.5,0,Math.PI*2);ctx.fill();
    });
    nodes.forEach((n,i)=>nodes.slice(i+1).forEach(m=>{const d=Math.hypot(n.x-m.x,n.y-m.y);if(d<150){ctx.strokeStyle=`rgba(0,180,255,${(1-d/150)*.07})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(m.x,m.y);ctx.stroke()}}));
    [[2,2],[w-62,2],[2,h-42],[w-62,h-42]].forEach(([cx,cy])=>{
      ctx.strokeStyle=`rgba(0,220,255,${.13+Math.sin(t)*.04})`;ctx.lineWidth=1;ctx.beginPath();
      ctx.moveTo(cx,cy+13);ctx.lineTo(cx,cy);ctx.lineTo(cx+13,cy);ctx.moveTo(cx+47,cy);ctx.lineTo(cx+60,cy);ctx.lineTo(cx+60,cy+13);
      ctx.moveTo(cx,cy+27);ctx.lineTo(cx,cy+40);ctx.lineTo(cx+13,cy+40);ctx.moveTo(cx+47,cy+40);ctx.lineTo(cx+60,cy+40);ctx.lineTo(cx+60,cy+27);
      ctx.stroke();
    });
    requestAnimationFrame(draw);
  })();
})();

function genHistory(commodity,days=60){
  const base=ALL_PRICES.find(p=>p.commodity===commodity)?.price||500;
  let price=base*.85,arr=[];
  for(let i=0;i<=days;i++){
    const d=new Date();d.setDate(d.getDate()-(days-i));
    price+=(Math.random()-.5)*base*.04;
    arr.push({date:d.toISOString().slice(0,10),price:Math.round(price)});
  }
  return arr;
}
function genForecast(commodity){
  const base=ALL_PRICES.find(p=>p.commodity===commodity)?.price||500;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const cur=new Date().getMonth();
  return months.map((m,i)=>({month:m,actual:i<=cur?Math.round(base*(1+(i-5)*.006)+(Math.random()-.5)*base*.04):null,forecast:Math.round(base*(1+(i-5)*.007)),upper:Math.round(base*(1+(i-5)*.007)*1.07),lower:Math.round(base*(1+(i-5)*.007)*.93)}));
}

// ── SVG CHART HELPERS ─────────────────────────────────────────────────────────
function svgPath(points,w,h,minV,maxV){
  if(!points.length)return'';
  const range=maxV-minV||1;
  return points.map((v,i)=>`${i===0?'M':'L'}${(i/(points.length-1))*w},${h-(v-minV)/range*h}`).join(' ');
}
function AreaChart({data,dataKey,color,w=300,h=130}){
  const vals=data.map(d=>d[dataKey]).filter(v=>v!=null);
  if(!vals.length)return null;
  const minV=Math.min(...vals)*0.98,maxV=Math.max(...vals)*1.02;
  const pts=data.filter(d=>d[dataKey]!=null);
  const path=svgPath(pts.map(d=>d[dataKey]),w,h,minV,maxV);
  const id='g'+Math.random().toString(36).slice(2);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="5%" stop-color="${color}" stop-opacity=".2"/>
      <stop offset="95%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${path} L${w},${h} L0,${h} Z" fill="url(#${id})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" style="filter:drop-shadow(0 0 3px ${color}80)"/>
  </svg>`;
}
function BarChartSVG({data,color='#00e5ff',w=300,h=140}){
  if(!data.length)return'';
  const maxV=Math.max(...data.map(d=>d.value))||1;
  const bw=Math.floor(w/data.length*0.65),gap=Math.floor(w/data.length);
  return `<svg viewBox="0 0 ${w} ${h+20}" style="width:100%;height:${h+20}px">
    ${data.map((d,i)=>{
      const bh=Math.round((d.value/maxV)*(h-4));
      const x=i*gap+(gap-bw)/2,y=h-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${color}" style="filter:drop-shadow(0 0 4px ${color}60)"/>
      <text x="${x+bw/2}" y="${h+14}" text-anchor="middle" fill="#3a6070" font-size="9" font-family="var(--f)">${d.label.slice(0,5)}</text>`;
    }).join('')}
  </svg>`;
}
function RadarSVG({data,color='#00e5ff',size=180}){
  if(!data.length)return'';
  const cx=size/2,cy=size/2,r=size*0.38;
  const pts=data.map((d,i)=>{const a=(i/data.length)*Math.PI*2-Math.PI/2;const rv=(d.v/100)*r;return{x:cx+Math.cos(a)*rv,y:cy+Math.sin(a)*rv,lx:cx+Math.cos(a)*(r+18),ly:cy+Math.sin(a)*(r+18),ax:cx+Math.cos(a)*r,ay:cy+Math.sin(a)*r,label:d.s}});
  const polyPts=pts.map(p=>`${p.x},${p.y}`).join(' ');
  const axisPts=pts.map(p=>`${p.ax},${p.ay}`).join(' ');
  const gridLevels=[.25,.5,.75,1].map(lvl=>pts.map((d,i)=>{const a=(i/data.length)*Math.PI*2-Math.PI/2;return`${cx+Math.cos(a)*r*lvl},${cy+Math.sin(a)*r*lvl}`}).join(' '));
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;height:${size}px">
    ${gridLevels.map(g=>`<polygon points="${g}" fill="none" stroke="rgba(0,220,255,0.15)" stroke-width=".5"/>`).join('')}
    ${pts.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p.ax}" y2="${p.ay}" stroke="rgba(0,220,255,0.12)" stroke-width=".5"/>`).join('')}
    <polygon points="${polyPts}" fill="${color}18" stroke="${color}" stroke-width="1.5" style="filter:drop-shadow(0 0 4px ${color})"/>
    ${pts.map(p=>`<text x="${p.lx}" y="${p.ly}" text-anchor="middle" dominant-baseline="middle" fill="#3a6070" font-size="9" font-family="var(--f)">${p.label}</text>`).join('')}
  </svg>`;
}
function ForecastSVG({data,w=300,h=160}){
  if(!data.length)return'';
  const allVals=[...data.map(d=>d.upper),...data.map(d=>d.lower)].filter(Boolean);
  const minV=Math.min(...allVals)*0.97,maxV=Math.max(...allVals)*1.03;
  const range=maxV-minV||1;
  const px=(i,v)=>`${(i/(data.length-1))*w},${h-(v-minV)/range*h}`;
  const upper=data.map((d,i)=>px(i,d.upper)).join(' L');
  const lower=data.map((d,i)=>px(i,d.lower)).join(' L');
  const lowerRev=[...data].reverse().map((d,i)=>px(data.length-1-i,d.lower)).join(' L');
  const fcast=data.map((d,i)=>px(i,d.forecast));
  const actual=data.filter(d=>d.actual).map((d,i)=>px(i,d.actual));
  const monthW=w/(data.length-1);
  return `<svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:${h+16}px">
    <path d="M${upper} L${lowerRev} Z" fill="rgba(0,255,136,0.07)"/>
    <path d="M${fcast.join(' L')}" fill="none" stroke="#00ff88" stroke-width="2" style="filter:drop-shadow(0 0 4px #00ff88)"/>
    ${actual.length?`<path d="M${actual.join(' L')}" fill="none" stroke="#7aacbc" stroke-width="1.5" stroke-dasharray="4 2"/>`:''}
    ${data.map((d,i)=>`<text x="${(i/(data.length-1))*w}" y="${h+12}" text-anchor="middle" fill="#3a6070" font-size="8" font-family="var(--f)">${d.month}</text>`).join('')}
  </svg>`;
}

// ── RENDER ENGINE ─────────────────────────────────────────────────────────────
const app=document.getElementById('app');
function set(key,val){
  if(typeof key==='object'){Object.assign(state,key)}else{state[key]=val}
  render();

function el(tag,attrs={},children=''){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')e.className=v;
    else if(k==='innerHTML')e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  if(typeof children==='string')e.innerHTML+=children;
  else if(Array.isArray(children))children.forEach(c=>{if(c)e.appendChild(typeof c==='string'?Object.assign(document.createElement('span'),{innerHTML:c}):c)});
  return e;
}

// ── COMPONENTS ────────────────────────────────────────────────────────────────
function ProvincePill(province){

function KPICard(label,value,sub,trend,accent,emoji){
  const c=el('div',{style:{background:'var(--panel)',border:'1px solid var(--br)',borderRadius:12,padding:'16px 18px',position:'relative',overflow:'hidden',backdropFilter:'blur(14px)'}});
  c.innerHTML=`
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,${accent},transparent);opacity:.6"></div>
    <div style="position:absolute;top:10px;right:12px;opacity:.14;font-size:26px">${emoji}</div>
    <div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px">${label}</div>
    <div style="font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.5px;text-shadow:${glow(accent,6)}">${value}</div>
    <div style="margin-top:4px;display:flex;align-items:center;gap:8px;font-size:11px">
      ${sub?`<span style="color:var(--dim)">${sub}</span>`:''}
      ${trend!==undefined?`<span style="color:${trend>0?'#00ff88':trend<0?'#ff3b5c':'var(--dim)';font-weight:700}">${trend>0?'▲':trend<0?'▼':'—'} ${Math.abs(trend).toFixed(1)}%</span>`:''}
    </div>`;

function buildAngolaMap(){
  const prov=state.province;
  const maxV=100;
  const vals=Object.fromEntries(PROV_MAP.map(p=>[p.id,rnd(10,100)]));
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','30 80 250 265');
  svg.style.cssText='width:100%;height:210px;display:block';
  svg.innerHTML=`
    <path d="M82,100 L95,92 L120,90 L155,88 L200,92 L230,108 L255,125 L268,150 L265,180 L258,210 L250,240 L238,265 L215,280 L195,295 L170,305 L145,308 L120,300 L100,288 L78,270 L65,248 L58,220 L55,195 L60,170 L68,148 L78,125 Z" fill="rgba(0,40,70,0.35)" stroke="rgba(0,220,255,0.2)" stroke-width="1.2"/>
    ${[120,150,180,210,240].map(y=>`<line x1="55" y1="${y}" x2="270" y2="${y}" stroke="rgba(0,220,255,0.07)" stroke-width=".4"/>`).join('')}
    ${[80,120,160,200,240].map(x=>`<line x1="${x}" y1="88" x2="${x}" y2="310" stroke="rgba(0,220,255,0.07)" stroke-width=".4"/>`).join('')}
  `;
  PROV_MAP.forEach(p=>{
    const isSel=prov===p.id;
    const color=isSel?'#ffaa00':'#00e5ff';
    const r=p.r*(isSel?1.6:1);
    const v=(vals[p.id]||50)/maxV;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor='pointer';
    g.innerHTML=`
      <circle cx="${p.cx}" cy="${p.cy}" r="${r*2.5}" fill="${color}${Math.round(v*25).toString(16).padStart(2,'0')}"/>
      <circle cx="${p.cx}" cy="${p.cy}" r="${r}" fill="${color}${Math.round(v*60+35).toString(16).padStart(2,'0')}" stroke="${color}" stroke-width="${isSel?1.6:.7}" opacity=".9" style="filter:drop-shadow(0 0 ${r}px ${color}90)"/>
      ${(isSel||p.id==='Luanda')?`<text x="${p.cx+p.r+3}" y="${p.cy+4}" fill="${isSel?'#ffaa00':'#00b8cc'}" font-size="7" font-family="var(--f)" font-weight="700">${p.id.length>9?p.id.slice(0,8):p.id}</text>`:''}
    `;
    g.addEventListener('click',()=>{set('province',prov===p.id?null:p.id);try{prov===p.id?localStorage.removeItem('compass_province'):localStorage.setItem('compass_province',p.id)}catch{}});
    g.addEventListener('mouseenter',()=>{g.querySelector('circle:nth-child(2)').setAttribute('r',p.r*1.4)});
    g.addEventListener('mouseleave',()=>{g.querySelector('circle:nth-child(2)').setAttribute('r',isSel?p.r*1.6:p.r)});
    svg.appendChild(g);
  });
  return svg;
}

async function sendCopilot(msg){
  if(!msg.trim()||state.copilotLoading)return;
  state.copilotMessages=[...state.copilotMessages,{role:'user',content:msg}];
  state.copilotInput='';state.copilotLoading=true;renderSection();
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:`You are the Commercial Copilot for Angoalissar Lda (Webcor Group), FMCG Angola. KPIs: Revenue ${fmtM(KPI.rev)} AOA, Volume ${fmt(KPI.vol)} MT, Margin ${KPI.margin}%. Scope: ${state.province||'All Angola'}. Competitors: Noble Group, Sodosa, Alimenta Angola, Kero, Candando. Be direct, analytical and action-oriented. Respond in English.`,messages:state.copilotMessages.slice(-20).map(m=>({role:m.role,content:m.content}))})});
    const data=await r.json();
    state.copilotMessages=[...state.copilotMessages,{role:'assistant',content:data.content?.find(c=>c.type==='text')?.text||'No response.'}];
  }catch{state.copilotMessages=[...state.copilotMessages,{role:'assistant',content:'⚠ Anthropic API not configured. Add your API key to enable the Copilot.'}];}
  state.copilotLoading=false;renderSection();
}

async function genBriefing(type){
  const toneMap={mild:'gentle',moderate:'direct and critical',brutal:'brutally honest'};
  const prompt=type==='briefing'?`Generate a daily executive briefing for Angoalissar. Scope: ${state.province||'All Angola'}. Horizon: ${state.copilotHorizon}. Include KPIs, risks, opportunities, 3 priority actions.`:`Devil's Advocate (${toneMap[state.copilotTone]}): Challenge Angoalissar's performance. Scope: ${state.province||'All Angola'}. Identify blind spots and ignored risks.`;
  state.copilotTab='chat';
  await sendCopilot(prompt);
  // save briefing
  const last=state.copilotMessages[state.copilotMessages.length-1];
  if(last?.role==='assistant'){
    const b={id:Date.now().toString(),title:type==='briefing'?`Executive Briefing — ${new Date().toLocaleDateString('en-GB')}`:`Devil's Advocate — ${new Date().toLocaleDateString('en-GB')}`,content:last.content,type,province:state.province,tone:state.copilotTone,horizon:state.copilotHorizon,generatedAt:new Date().toISOString()};
    state.briefings=[b,...state.briefings];
    try{localStorage.setItem('compass_briefings',JSON.stringify(state.briefings.slice(0,50)))}catch{}
  }
}

    const btn=el('button',{style:{width:'100%',display:'flex',alignItems:'center',gap:10,padding:collapsed?'10px 0':'10px 14px',justifyContent:collapsed?'center':'flex-start',background:a?'rgba(0,229,255,0.1)':'transparent',borderLeft:a?'2px solid #00e5ff':'2px solid transparent',border:'none',borderTop:'none',borderBottom:'none',borderRight:'none',cursor:'pointer',transition:'all .12s',position:'relative'}});
    if(a){const bar=el('div',{style:{position:'absolute',left:2,top:'18%',bottom:'18%',width:'2px',background:'#00e5ff',borderRadius:1,boxShadow:glow('#00e5ff',8)}});btn.appendChild(bar);}
    btn.innerHTML+=`<span style="font-size:15px;filter:${a?`drop-shadow(0 0 6px #00e5ff)`:'none'}">${e}</span>`;
    if(!collapsed){
      btn.innerHTML+=`<span style="font-size:11px;font-weight:${a?700:400};color:${a?'#00e5ff':'var(--dim)'};flex:1;text-align:left;letter-spacing:.5px">${label}</span>`;
      if(badge)btn.innerHTML+=`<span style="font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;background:rgba(0,229,255,0.2);color:#00e5ff;border:1px solid rgba(0,229,255,0.4);letter-spacing:1px">${badge}</span>`;
    }
    btn.addEventListener('click',()=>{set('section',key);if(window.innerWidth<769)set('mobileOpen',false)});
    nav.appendChild(btn);
  });
  sb.appendChild(nav);
  // Mini feed
  if(!collapsed){
    const feed=el('div',{style:{borderTop:'1px solid var(--br)',padding:'10px 12px'}});
    feed.innerHTML=`<div style="font-size:8px;color:var(--dim);font-weight:800;margin-bottom:8px;letter-spacing:2px">◉ LIVE · ${prov?.toUpperCase()||'ALL'}</div>`;
    NEWS.filter(n=>!prov||!n.prov||n.prov===prov).slice(0,3).forEach(n=>{
      feed.innerHTML+=`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:flex-start"><div style="width:4px;height:4px;border-radius:50%;background:${SENT[n.sent]};margin-top:4px;flex-shrink:0;box-shadow:0 0 4px ${SENT[n.sent]}"></div><div style="font-size:9px;color:var(--dim);line-height:1.4">${n.headline.slice(0,52)}…</div></div>`;
    });
    sb.appendChild(feed);
  }
  return sb;
}

// ── FX TICKER ─────────────────────────────────────────────────────────────────
let tickerOffset=0,tickerRaf=null;
function renderFXTicker(){
  const el2=document.getElementById('fxTicker');
  if(!el2)return;
  const inner=el2.querySelector('.ticker-inner');
  if(!inner)return;
  const items=[...state.fxRates,...state.fxRates];
  inner.innerHTML=items.map(r=>`<span style="padding:0 18px;font-size:10px;border-right:1px solid var(--br);display:inline-flex;align-items:center;gap:7px"><span style="color:var(--dim);font-weight:700">${r.pair}</span><span style="color:var(--tx);font-weight:800">${r.rate.toFixed(1)}</span><span style="color:${r.chg>=0?'#00ff88':'#ff3b5c'};font-size:9px">${r.chg>=0?'▲':'▼'} ${Math.abs(r.chg).toFixed(1)}</span></span>`).join('');
}

function startTickerAnim(){
  if(tickerRaf)cancelAnimationFrame(tickerRaf);
  const run=()=>{
    const inner=document.querySelector('.ticker-inner');
    if(inner){tickerOffset-=.5;if(tickerOffset<-inner.scrollWidth/2)tickerOffset=0;inner.style.transform=`translateX(${tickerOffset}px)`;}
    tickerRaf=requestAnimationFrame(run);
  };
  tickerRaf=requestAnimationFrame(run);
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function renderSection(){
  const content=document.getElementById('mainContent');
  if(!content)return;
  content.innerHTML='';
  const sec={overview:renderOverview,commodities:renderCommodities,distributors:renderDistributors,profitability:renderProfitability,landed:renderLandedCost,copilot:renderCopilot,news:renderNews,settings:renderSettings,briefings:renderBriefings}[state.section];
  if(sec)content.appendChild(sec());
  content.scrollTop=0;
}

function buildCSVModal(){
  const prov=state.province;
  const prices=prov?ALL_PRICES.filter(p=>p.province===prov):ALL_PRICES;
  const m=el('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.82)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20,backdropFilter:'blur(6px)'}});
  const box=el('div',{className:'panel',style:{padding:26,width:'100%',maxWidth:520,border:'1px solid var(--brh)'}});
  box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><div style="font-size:14px;font-weight:900;color:var(--tx);text-shadow:${glow('#00e5ff',8)}">EXPORT CSV</div></div></div>`;
  box.querySelector('div').querySelector('div').appendChild(ProvincePill(prov));
  const closeBtn=el('button',{style:{background:'none',border:'none',color:'var(--dim)',fontSize:20,cursor:'pointer'}},'✕');
  closeBtn.addEventListener('click',()=>{document.body.removeChild(m)});
  box.querySelector('div').appendChild(closeBtn);
  box.innerHTML+=`<div style="font-size:10px;color:var(--dim);margin-bottom:10px">${prices.length} rows · Preview:</div>
  <div style="overflow-x:auto;background:rgba(0,229,255,0.04);border-radius:8px;padding:10px;margin-bottom:16px;border:1px solid var(--br)">
  <table style="font-size:10px;border-collapse:collapse;white-space:nowrap">
  <thead><tr>${['province','commodity','price','currency','unit'].map(c=>`<th style="padding:4px 10px;color:#00e5ff;font-weight:700;text-align:left">${c}</th>`).join('')}</tr></thead>
  <tbody>${prices.slice(0,5).map(r=>`<tr>${['province','commodity','price','currency','unit'].map(c=>`<td style="padding:4px 10px;color:var(--mid);border-top:1px solid rgba(0,220,255,0.08)">${r[c]}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
  const dlBtn=el('button',{style:{padding:'11px 22px',background:'rgba(0,229,255,0.15)',border:'1px solid #00e5ff',borderRadius:8,color:'#00e5ff',fontSize:11,fontWeight:800,boxShadow:glow('#00e5ff',8),display:'flex',alignItems:'center',gap:8}},'⬇ DOWNLOAD CSV');
  dlBtn.addEventListener('click',()=>{
    const cols=['province','commodity','price','currency','unit'];
    const csv=[cols.join(','),...prices.map(r=>cols.map(c=>r[c]).join(','))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`compass_${prov||'all'}_${new Date().toISOString().slice(0,10)}.csv`;a.click();
    document.body.removeChild(m);
  });
  box.appendChild(dlBtn);m.appendChild(box);document.body.appendChild(m);
}

function buildPPTXModal(){
  const prov=state.province;
  const m=el('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.82)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20,backdropFilter:'blur(6px)'}});
  const box=el('div',{className:'panel',style:{padding:28,width:'100%',maxWidth:500,border:'1px solid var(--brh)',boxShadow:glow('#00e5ff',20)}});
  box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px"><div><div style="font-size:15px;font-weight:900;color:var(--tx);letter-spacing:1px;text-shadow:${glow('#00e5ff',8)}">BOARD PRESENTATION</div><div style="font-size:10px;color:var(--dim);margin-top:3px">Export to PowerPoint</div></div></div>`;
  box.querySelector('div').querySelector('div').appendChild(ProvincePill(prov));
  const closeBtn2=el('button',{style:{background:'none',border:'none',color:'var(--dim)',fontSize:20,cursor:'pointer'}},'✕');
  closeBtn2.addEventListener('click',()=>document.body.removeChild(m));
  box.querySelector('div').appendChild(closeBtn2);
  [['📊','Executive Summary','Revenue, volume, margin, DSO KPIs'],['💹','Market Prices','Commodity prices by province and trend'],['👥','Distributor Performance','Rankings, scorecards, radar profile'],['📈','Profitability Analysis','Margin by brand, region, channel, SKU'],['⚡','Risks & Opportunities','Market intelligence and competitive analysis'],['🎯','Action Plan','3 priority commercial actions']].forEach(([e,t,d],i)=>{
    box.innerHTML+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(0,229,255,0.07);border:1px solid var(--br);border-radius:8px;margin-bottom:8px"><span style="font-size:18px">${e}</span><div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--tx)">Slide ${i+1}: ${t}</div><div style="font-size:10px;color:var(--dim)">${d}</div></div><div style="width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,229,255,.5);display:flex;align-items:center;justify-content:center"><div style="width:5px;height:5px;border-radius:50%;background:#00e5ff"></div></div></div>`;
  });
  const expBtn=el('button',{style:{width:'100%',marginTop:4,padding:13,background:'rgba(0,229,255,0.15)',border:'1px solid #00e5ff',borderRadius:10,color:'#00e5ff',fontSize:12,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',gap:10,textShadow:glow('#00e5ff'),boxShadow:glow('#00e5ff',10)}},'📊 EXPORT PPTX');
  expBtn.addEventListener('click',()=>{
    const lines=['ANGOALISSAR COMPASS — BOARD PRESENTATION',`Generated: ${new Date().toLocaleString('en-GB')}`,`Scope: ${prov||'All Angola'}`,'',...[['Executive Summary','Revenue, volume, margin KPIs'],['Market Prices','Commodity prices by province'],['Distributor Performance','Rankings and scorecards'],['Profitability Analysis','Margin by brand and channel'],['Risks & Opportunities','Market intelligence'],['Action Plan','3 priority actions']].flatMap(([t,d],i)=>[`SLIDE ${i+1}: ${t}`,d,''])];
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download=`Angoalissar_Board_${prov||'Angola'}_${new Date().toISOString().slice(0,10)}.txt`;a.click();
    document.body.removeChild(m);
  });
  box.appendChild(expBtn);m.appendChild(box);document.body.appendChild(m);
}

function render(){
  app.innerHTML='';
  // Sidebar (desktop)
  app.appendChild(buildSidebar());
  // Main column
  const main=el('main',{style:{flex:1,minHeight:'100vh',overflowX:'hidden'}});
  // Topbar
  const header=el('header',{style:{position:'sticky',top:0,zIndex:50,background:'rgba(1,8,20,0.92)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--br)',padding:'10px 22px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}});
  const hl=el('div',{style:{display:'flex',alignItems:'center',gap:12}});
  const mobBtn=el('button',{className:'mob-btn',style:{background:'none',border:'none',color:'var(--cd)',padding:4,fontSize:20,display:'none'}},'☰');
  mobBtn.addEventListener('click',()=>{
    // mobile sidebar toggle
    const existing=document.getElementById('mobileSidebar');
    if(existing){document.body.removeChild(existing);return;}
    const overlay=el('div',{id:'mobileSidebar',style:{position:'fixed',inset:0,zIndex:200}});
    const bg=el('div',{style:{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)'}});
    bg.addEventListener('click',()=>document.body.removeChild(overlay));
    const sb2=buildSidebar();
    sb2.style.cssText='position:absolute;left:0;top:0;bottom:0;width:220px;display:flex!important';
    overlay.appendChild(bg);overlay.appendChild(sb2);document.body.appendChild(overlay);
  });
  hl.appendChild(mobBtn);
  const secLabel=NAV.find(n=>n.key===state.section)?.label||'';
  hl.innerHTML+=`<div><div style="font-size:13px;font-weight:800;color:var(--tx);letter-spacing:1px;text-shadow:${glow('#00e5ff',6)}">${secLabel.toUpperCase()}</div><div style="font-size:9px;color:var(--dim);letter-spacing:1px">${new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div></div>`;
  header.appendChild(hl);
  // Topbar right
  const hr=el('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}});
  // Province selector
  const provWrap=el('div',{style:{position:'relative'}});
  const provBtn=el('button',{style:{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',background:'rgba(0,229,255,0.08)',border:'1px solid var(--br)',borderRadius:8,color:'var(--mid)',fontSize:10}});
  provBtn.innerHTML=`📍 <span style="color:var(--tx);font-weight:700">${state.province||'ALL'}</span> ▾`;
  provBtn.addEventListener('click',e=>{e.stopPropagation();const dd=document.getElementById('provDD');if(dd)dd.remove();else buildProvDD(provWrap)});
  provWrap.appendChild(provBtn);hr.appendChild(provWrap);
  const pptxBtn=el('button',{style:{padding:'6px 12px',background:'rgba(0,102,255,0.12)',border:'1px solid rgba(0,102,255,.5)',borderRadius:8,color:'#6699ff',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',gap:5}},'📊 PPTX');
  pptxBtn.addEventListener('click',buildPPTXModal);hr.appendChild(pptxBtn);
  const csvBtn=el('button',{style:{padding:'6px 12px',background:'rgba(0,229,255,0.08)',border:'1px solid var(--br)',borderRadius:8,color:'var(--cd)',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',gap:5}},'⬇ CSV');
  csvBtn.addEventListener('click',buildCSVModal);hr.appendChild(csvBtn);
  header.appendChild(hr);main.appendChild(header);
  // FX Ticker
  const ticker=el('div',{id:'fxTicker',style:{overflow:'hidden',borderTop:'1px solid var(--br)',borderBottom:'1px solid var(--br)',height:26,display:'flex',alignItems:'center',background:'rgba(0,6,16,0.9)'}});
  ticker.innerHTML=`<div class="ticker-inner" style="display:flex;white-space:nowrap;will-change:transform">${[...state.fxRates,...state.fxRates].map(r=>`<span style="padding:0 18px;font-size:10px;border-right:1px solid var(--br);display:inline-flex;align-items:center;gap:7px"><span style="color:var(--dim);font-weight:700">${r.pair}</span><span style="color:var(--tx);font-weight:800">${r.rate.toFixed(1)}</span><span style="color:${r.chg>=0?'#00ff88':'#ff3b5c'};font-size:9px">${r.chg>=0?'▲':'▼'} ${Math.abs(r.chg).toFixed(1)}</span></span>`).join('')}</div>`;
  main.appendChild(ticker);
  // Province pill row
  const ppRow=el('div',{style:{padding:'10px 22px 0',display:'flex',alignItems:'center',gap:8}});
  ppRow.appendChild(ProvincePill(state.province));
  if(state.province){
    const clr=el('button',{style:{fontSize:9,color:'var(--dim)',background:'none',border:'none',cursor:'pointer',letterSpacing:.5}},'✕ CLEAR');
    clr.addEventListener('click',()=>{set('province',null);try{localStorage.removeItem('compass_province')}catch{}});
    ppRow.appendChild(clr);
  }
  main.appendChild(ppRow);
  // Content
  const content=el('div',{id:'mainContent',style:{padding:'18px 22px 56px'}});
  main.appendChild(content);
  app.appendChild(main);
  renderSection();
  requestAnimationFrame(startTickerAnim);
  document.addEventListener('click',()=>{document.getElementById('provDD')?.remove()},{once:true});
}

function buildProvDD(parent){
  const dd=el('div',{id:'provDD',style:{position:'absolute',top:'110%',right:0,width:210,background:'rgba(0,10,22,0.98)',border:'1px solid var(--brh)',borderRadius:10,zIndex:100,padding:6,boxShadow:`0 8px 32px rgba(0,0,0,.75),${glow('#00e5ff',18)}`,maxHeight:280,overflowY:'auto'}});
  const allBtn=el('button',{style:{width:'100%',padding:'7px 10px',borderRadius:6,background:!state.province?'rgba(0,229,255,0.15)':'transparent',border:'none',color:!state.province?'#00e5ff':'var(--dim)',textAlign:'left',fontSize:11,fontWeight:!state.province?700:400,fontFamily:'var(--f)'}},'All Provinces');
  allBtn.addEventListener('click',e=>{e.stopPropagation();set('province',null);try{localStorage.removeItem('compass_province')}catch{};dd.remove()});
  dd.appendChild(allBtn);
  PROVINCES.forEach(p=>{
    const btn=el('button',{style:{width:'100%',padding:'6px 10px',borderRadius:6,background:state.province===p?'rgba(0,229,255,0.12)':'transparent',border:'none',color:state.province===p?'#00e5ff':'var(--dim)',textAlign:'left',fontSize:10,fontWeight:state.province===p?700:400,fontFamily:'var(--f)'}},p);
    btn.addEventListener('click',e=>{e.stopPropagation();set('province',p);try{localStorage.setItem('compass_province',p)}catch{};dd.remove()});
    dd.appendChild(btn);
  });
  parent.appendChild(dd);
}

// Boot
render();
</script>
</body>
</html>
