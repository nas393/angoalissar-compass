<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Angoalissar Compass</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#010810;--panel:rgba(0,14,28,.88);--br:rgba(0,220,255,.13);--brh:rgba(0,220,255,.5);--tx:#e0f7ff;--mid:#7aacbc;--dim:#3a6070;--c:#00e5ff;--cd:#00b8cc;--g:#00ff88;--a:#ffaa00;--r:#ff3b5c;--sb:rgba(0,5,14,.97);--tb:rgba(1,8,20,.93);--f:'IBM Plex Mono','Courier New',monospace}
body.light{--bg:#eef2f7;--panel:rgba(255,255,255,.93);--br:rgba(0,100,180,.14);--brh:rgba(0,100,180,.5);--tx:#0a1628;--mid:#2a4a6a;--dim:#6a8aaa;--c:#0055cc;--cd:#0044aa;--g:#007744;--a:#cc7700;--r:#cc2244;--sb:rgba(235,242,252,.98);--tb:rgba(235,242,252,.96)}
body.neon{--bg:#000512;--panel:rgba(10,0,28,.9);--br:rgba(200,0,255,.18);--brh:rgba(200,0,255,.6);--tx:#f0d0ff;--mid:#bb88cc;--dim:#664466;--c:#dd00ff;--cd:#aa00cc;--g:#00ffaa;--a:#ffcc00;--r:#ff2255;--sb:rgba(8,0,20,.98);--tb:rgba(5,0,15,.96)}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--c);border-radius:2px;opacity:.4}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease}
.panel{background:var(--panel);border:1px solid var(--br);border-radius:12px;backdrop-filter:blur(14px)}
button{cursor:pointer;font-family:var(--f);transition:opacity .15s}
button:hover{opacity:.82}
input:focus,select:focus{outline:none;border-color:var(--c)!important}
select option{background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh;position:relative;z-index:1}
.sbr{width:220px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--sb);border-right:1px solid var(--br);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s,background .25s;z-index:10}
.sbr.col{width:58px}
main{flex:1;min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;background:var(--tb);backdrop-filter:blur(16px);border-bottom:1px solid var(--br);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;transition:background .25s}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g2l{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.content{padding:16px 20px 60px}
.ticker{overflow:hidden;border-top:1px solid var(--br);border-bottom:1px solid var(--br);height:26px;display:flex;align-items:center;background:var(--sb)}
.ticker-inner{display:flex;white-space:nowrap}
.nbtn{width:100%;display:flex;align-items:center;gap:9px;padding:10px 14px;background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;color:var(--dim);font-size:11px;font-family:var(--f);letter-spacing:.5px;position:relative;transition:all .12s}
.nbtn.act{background:rgba(0,229,255,.08);border-left-color:var(--c);color:var(--c)}
.nbtn.col{justify-content:center;padding:10px 0}
.tbtn{padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--f);border:1px solid var(--br);background:transparent;color:var(--dim);letter-spacing:.5px;transition:all .15s}
.tbtn.act{border-color:var(--c);background:rgba(0,229,255,.12);color:var(--c)}
table{width:100%;border-collapse:collapse}
th{padding:7px 12px;text-align:left;color:var(--dim);font-weight:700;font-size:9px;letter-spacing:1px;background:rgba(0,229,255,.05)}
td{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--br);color:var(--tx)}
.ppill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.mbox{padding:24px;width:100%;max-width:520px}
/* Side panel */
#sp{position:fixed;top:0;right:-440px;width:420px;height:100vh;z-index:900;overflow-y:auto;transition:right .28s cubic-bezier(.4,0,.2,1);background:var(--sb);border-left:1px solid var(--brh);padding:0;display:flex;flex-direction:column}
#sp.open{right:0}
.sp-head{padding:16px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--sb);z-index:1}
.sp-body{padding:20px;flex:1}
.news-card{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.news-card:hover{border-color:var(--c)!important;box-shadow:0 0 0 1px var(--c)20}
.mob-btn{display:none}
/* RSS feed manager */
#rssManager{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1100;backdrop-filter:blur(5px)}
#rssManager.open{display:flex;align-items:center;justify-content:center;padding:20px}
@media(max-width:768px){.sbr{display:none!important}.mob-btn{display:flex!important}.g2{grid-template-columns:1fr!important}.g2l{grid-template-columns:1fr!important}.g3{grid-template-columns:1fr!important}.kgrid{grid-template-columns:repeat(2,1fr)!important}#sp{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sp"><div class="sp-head"><span id="sp-title" style="font-size:12px;font-weight:700;color:var(--tx)">Article</span><button id="sp-close" style="background:none;border:1px solid var(--br);border-radius:8px;padding:5px 12px;color:var(--tx);font-size:12px;font-weight:700">✕ Close</button></div><div class="sp-body" id="sp-body"></div></div>
<div id="rssManager"><div class="panel mbox" style="max-width:620px;max-height:85vh;overflow-y:auto;padding:24px"></div></div>

<script>
// ── Wire close button immediately so it always works ──────────────────────
document.getElementById('sp-close').onclick=function(){document.getElementById('sp').classList.remove('open');};

// ── RSS Feed registry (user-managed) ─────────────────────────────────────
var DEFAULT_FEEDS=[
  {name:'Correio da Kianda',url:'https://correiokianda.info/feed/',cat:'angola',on:true},
  {name:'Noticias de Angola',url:'https://noticiasdeangola.co.ao/feed/',cat:'angola',on:true},
  {name:'Folha 8',url:'https://jornalf8.net/feed/',cat:'angola',on:true},
  {name:'Maka Angola',url:'https://www.makaangola.org/feed/',cat:'angola',on:true},
  {name:'Club-K Angola',url:'https://www.club-k.net/feed/',cat:'angola',on:false},
  {name:'BBC Africa',url:'https://feeds.bbci.co.uk/news/world/africa/rss.xml',cat:'africa',on:true},
  {name:'AllAfrica',url:'https://allafrica.com/tools/headlines/rdf/africa/headlines.rdf',cat:'africa',on:false},
  {name:'Africanews',url:'https://www.africanews.com/feed/rss?themes=news',cat:'africa',on:false},
  {name:'NYT Africa',url:'https://rss.nytimes.com/services/xml/rss/nyt/Africa.xml',cat:'world',on:false},
  {name:'BBC World',url:'https://feeds.bbci.co.uk/news/world/rss.xml',cat:'world',on:false}
];
var feeds=[];
try{var sf=localStorage.getItem('compass_feeds');feeds=sf?JSON.parse(sf):DEFAULT_FEEDS;}catch(e){feeds=DEFAULT_FEEDS;}

function saveFeeds(){try{localStorage.setItem('compass_feeds',JSON.stringify(feeds));}catch(e){}}

// RSS2JSON proxy — free, no key needed for public feeds
var PROXY='https://api.rss2json.com/v1/api.json?rss_url=';

// ── State ─────────────────────────────────────────────────────────────────
var S={
  section:'overview',province:null,collapsed:false,
  commodity:'Rice',groupBy:'brand',
  newsCat:null,newsDateFrom:'',newsDateTo:'',newsSearch:'',
  copilotTab:'chat',copilotTone:'moderate',copilotHorizon:'30 days',
  msgs:[],copilotLoading:false,
  landed:{baseCostUSD:18.5,freightUSD:2.8,customsDuty:10,fxRate:870,otherCosts:500,sellingPrice:24500},
  settings:{copilotMemory:10,devilTone:'moderate',briefingEnabled:false,briefingTime:'07:30'},
  briefings:[],histCache:{},fcastCache:{},
  fxRates:[{pair:'USD/AOA',rate:878.4,chg:.3},{pair:'EUR/AOA',rate:953.2,chg:-.8},{pair:'CNY/AOA',rate:121.3,chg:.1},{pair:'GBP/AOA',rate:1112.7,chg:1.2},{pair:'BRL/AOA',rate:159.6,chg:-.4}],
  theme:'dark',articles:[],newsLoading:false,newsError:null,
  priceEdit:false,manualPrices:{}
};
try{Object.assign(S.settings,JSON.parse(localStorage.getItem('compass_settings')||'{}'));}catch(e){}
try{S.province=localStorage.getItem('compass_province')||null;}catch(e){}
try{S.briefings=JSON.parse(localStorage.getItem('compass_briefings')||'[]');}catch(e){}
try{S.theme=localStorage.getItem('compass_theme')||'dark';}catch(e){}
try{S.manualPrices=JSON.parse(localStorage.getItem('compass_mprice')||'{}');}catch(e){}
applyTheme(S.theme,false);

function applyTheme(t,rerender){S.theme=t;document.body.className=t==='light'?'light':t==='neon'?'neon':'';try{localStorage.setItem('compass_theme',t);}catch(e){}if(rerender)render();}

// ── Data ──────────────────────────────────────────────────────────────────
var PROVINCES=['Luanda','Benguela','Huila','Cabinda','Cuanza Norte','Cuanza Sul','Malanje','Lunda Norte','Namibe','Uige','Huambo','Bie','Cunene','Moxico','Zaire','Bengo','Lunda Sul','Cuando Cubango'];
var COMMODITIES=['Rice','Maize','Beans','Oil','Sugar','Flour'];
var BRANDS=['Madrugada','Aguia','Stallion','Patriota','Uncle Sam'];
var REGIONS=['Luanda','Benguela','Huambo','Lobito','Lubango','Cabinda','Namibe','Uige'];
var CHANNELS=['Wholesale','Retail','HoReCa','Modern Trade'];
var PR={Rice:[400,800],Maize:[200,500],Beans:[600,1200],Oil:[1000,2000],Sugar:[500,1000],Flour:[300,700]};
var KPI={rev:2840000000,vol:21868,margin:6.4,cust:312,dso:38,region:'Luanda',growth:4.2,mvt:-2.1};
var FXI=[{pair:'USD/AOA',rate:878.4,chg:.3},{pair:'EUR/AOA',rate:953.2,chg:-.8},{pair:'CNY/AOA',rate:121.3,chg:.1},{pair:'GBP/AOA',rate:1112.7,chg:1.2},{pair:'BRL/AOA',rate:159.6,chg:-.4}];
S.fxRates=JSON.parse(JSON.stringify(FXI));

var ALL_PRICES=[];
PROVINCES.forEach(function(p){COMMODITIES.forEach(function(c){ALL_PRICES.push({province:p,commodity:c,price:PR[c][0]+Math.floor(Math.random()*(PR[c][1]-PR[c][0])),currency:'AOA',unit:'kg'});});});

function getPrice(p,c){var k=p+'__'+c;if(S.manualPrices[k])return S.manualPrices[k];for(var i=0;i<ALL_PRICES.length;i++){if(ALL_PRICES[i].province===p&&ALL_PRICES[i].commodity===c)return ALL_PRICES[i].price;}return 0;}
function setManualPrice(p,c,v){S.manualPrices[p+'__'+c]=parseFloat(v)||0;try{localStorage.setItem('compass_mprice',JSON.stringify(S.manualPrices));}catch(e){}}

COMMODITIES.forEach(function(c){
  var base=ALL_PRICES.find(function(p){return p.commodity===c;}).price;
  var hist=[],price=base*.85;
  for(var i=60;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);price+=(Math.random()-.5)*base*.04;hist.push({date:d.toISOString().slice(0,10),price:Math.round(price)});}
  S.histCache[c]=hist;
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],cur=new Date().getMonth();
  S.fcastCache[c]=months.map(function(m,i){return{month:m,actual:i<=cur?Math.round(base*(1+(i-5)*.006)+(Math.random()-.5)*base*.04):null,forecast:Math.round(base*(1+(i-5)*.007)),upper:Math.round(base*(1+(i-5)*.007)*1.07),lower:Math.round(base*(1+(i-5)*.007)*.93)};});
});

var DISTRIB=[];
['Norte Distributors','Sul Commerce','Benguela Trade','Luanda Wholesale','Cabinda Supply','Huambo Distrib','Lobito Commerce','Namibe Traders'].forEach(function(name,i){
  var s=55+Math.floor(Math.random()*60),pr=4+Math.random()*14,co=70+Math.floor(Math.random()*28),cv=55+Math.floor(Math.random()*40),gr=-5+Math.random()*27;
  var score=Math.min(Math.round((Math.min(s,100)*.3+pr*2+co*.25+cv*.2+Math.max(gr+5,0)*1.5)/1.5),100);
  DISTRIB.push({name:name,region:REGIONS[i%8],sales:s,profit:parseFloat(pr.toFixed(1)),collect:co,coverage:cv,growth:parseFloat(gr.toFixed(1)),score:score,rank:0});
});
DISTRIB.sort(function(a,b){return b.score-a.score;}).forEach(function(d,i){d.rank=i+1;});

var SKUPROF=[];
['Madrugada Flour 50kg','Aguia Flour 25kg','Stallion Flour 50kg','Patriota Rice 25kg','Uncle Sam Rice 5kg','Sugar 50kg','Beans 25kg','Oil 5L'].forEach(function(sku){
  REGIONS.slice(0,4).forEach(function(region){var rev=80000+Math.floor(Math.random()*420000),cp=.79+Math.random()*.17;SKUPROF.push({sku:sku,brand:BRANDS[Math.floor(Math.random()*5)],region:region,channel:CHANNELS[Math.floor(Math.random()*4)],rev:rev,cost:Math.round(rev*cp),margin:parseFloat(((1-cp)*100).toFixed(1))});});
});

// ── Helpers ───────────────────────────────────────────────────────────────
var fmt=function(n){return(n||0).toLocaleString('en-US',{maximumFractionDigits:0});};
var fmtM=function(n){return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':fmt(n);};
var glow=function(c,s){s=s||10;return '0 0 '+s+'px '+c+'40';};

function el(tag,style,html){var e=document.createElement(tag);if(style)e.style.cssText=style;if(html!==undefined)e.innerHTML=html;return e;}
function div(style,html){return el('div',style,html);}
function btn(text,style,onclick){var b=el('button',style);b.textContent=text;if(onclick)b.onclick=onclick;return b;}
function inp(type,val,style,cb){var i=el('input',style);i.type=type;if(val!==undefined&&val!==null)i.value=val;if(cb)i.addEventListener('input',cb);return i;}

function pill(prov){var c=prov?'var(--a)':'var(--cd)';var d=div('display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;background:'+c+'15;border:1px solid '+c+'30;color:'+c);d.textContent='\uD83D\uDCCD '+(prov?prov.toUpperCase():'ALL PROVINCES');return d;}

function sectionHead(title,sub,prov){
  var d=div('margin-bottom:18px');
  var h=el('h2','font-size:17px;font-weight:900;color:var(--tx);letter-spacing:.5px');h.textContent=title;d.appendChild(h);
  if(sub){var s=el('p','font-size:11px;color:var(--dim);margin-top:3px');s.textContent=sub;d.appendChild(s);}
  var pw=div('margin-top:7px');pw.appendChild(pill(prov));d.appendChild(pw);return d;
}

function kpiCard(label,value,sub,trend,accent,emoji){
  var c=div('','<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,'+accent+',transparent);opacity:.6"></div>'
    +'<div style="position:absolute;top:10px;right:12px;opacity:.14;font-size:24px">'+emoji+'</div>'
    +'<div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">'+label+'</div>'
    +'<div style="font-size:21px;font-weight:800;color:var(--tx)">'+value+'</div>'
    +(sub||trend!==undefined?'<div style="margin-top:4px;display:flex;align-items:center;gap:7px;font-size:11px">'
      +(sub?'<span style="color:var(--dim)">'+sub+'</span>':'')
      +(trend!==undefined?'<span style="font-weight:700;color:'+(trend>0?'var(--g)':trend<0?'var(--r)':'var(--dim)')+'"> '+(trend>0?'▲':trend<0?'▼':'—')+Math.abs(trend).toFixed(1)+'%</span>':'')
      +'</div>':''));
  c.className='panel';c.style.cssText='padding:15px 17px;position:relative;overflow:hidden';return c;
}

// ── SVG Charts ─────────────────────────────────────────────────────────────
function svgArea(data,key,color,w,h){
  w=w||280;h=h||120;
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return '';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  var pts=vals.map(function(v,i){return (i===0?'M':'L')+(i/(vals.length-1)*w)+','+(h-(v-mn)/rng*h);}).join(' ');
  var id='a'+Math.random().toString(36).slice(2,7);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="'+color+'" stop-opacity=".22"/><stop offset="95%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+pts+' L'+w+','+h+' L0,'+h+' Z" fill="url(#'+id+')" />'
    +'<path d="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}

function svgBars(labels,vals,w,h){
  w=w||280;h=h||130;
  if(!vals.length)return '';
  var mx=Math.max.apply(null,vals)||1,bw=Math.floor(w/vals.length*.65),gap=Math.floor(w/vals.length),out='';
  vals.forEach(function(v,i){var bh=Math.round((v/mx)*(h-4)),x=i*gap+(gap-bw)/2,y=h-bh;out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="var(--c)"/><text x="'+(x+bw/2)+'" y="'+(h+14)+'" text-anchor="middle" fill="var(--dim)" font-size="9" font-family="monospace">'+(labels[i]||'').slice(0,5)+'</text>';});
  return '<svg viewBox="0 0 '+w+' '+(h+18)+'" style="width:100%;height:'+(h+18)+'px;display:block">'+out+'</svg>';
}

function svgRadar(items,size){
  size=size||180;if(!items.length)return '';
  var cx=size/2,cy=size/2,r=size*.38,n=items.length;
  function pt(i,v){var a=i/n*Math.PI*2-Math.PI/2;return{x:cx+Math.cos(a)*v,y:cy+Math.sin(a)*v};}
  var poly=items.map(function(d,i){var p=pt(i,r*d.v/100);return p.x+','+p.y;}).join(' ');
  var grid='',axes='',labels='';
  [.25,.5,.75,1].forEach(function(lv){var gp=items.map(function(d,i){var p=pt(i,r*lv);return p.x+','+p.y;}).join(' ');grid+='<polygon points="'+gp+'" fill="none" stroke="var(--br)" stroke-width=".5"/>';});
  items.forEach(function(d,i){var p=pt(i,r),lp=pt(i,r+18);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x+'" y2="'+p.y+'" stroke="var(--br)" stroke-width=".5"/>';labels+='<text x="'+lp.x+'" y="'+lp.y+'" text-anchor="middle" dominant-baseline="middle" fill="var(--dim)" font-size="9" font-family="monospace">'+d.s+'</text>';});
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:100%;height:'+size+'px;display:block">'+grid+axes+'<polygon points="'+poly+'" fill="var(--c)18" stroke="var(--c)" stroke-width="1.5"/>'+labels+'</svg>';
}

function svgForecast(data,w,h){
  w=w||280;h=h||145;if(!data.length)return '';
  var allV=[];data.forEach(function(d){if(d.upper)allV.push(d.upper);if(d.lower)allV.push(d.lower);});
  var mn=Math.min.apply(null,allV)*.97,mx=Math.max.apply(null,allV)*1.03,rng=mx-mn||1;
  function px(i,v){return (i/(data.length-1)*w)+','+(h-(v-mn)/rng*h);}
  var up=data.map(function(d,i){return px(i,d.upper);}).join(' L');
  var lrv=data.slice().reverse().map(function(d,i){return px(data.length-1-i,d.lower);}).join(' L');
  var fc=data.map(function(d,i){return px(i,d.forecast);}).join(' L');
  var ac=data.filter(function(d){return d.actual;}).map(function(d,i){return px(i,d.actual);});
  var mo=data.map(function(d,i){return '<text x="'+(i/(data.length-1)*w)+'" y="'+(h+12)+'" text-anchor="middle" fill="var(--dim)" font-size="8" font-family="monospace">'+d.month+'</text>';}).join('');
  return '<svg viewBox="0 0 '+w+' '+(h+16)+'" style="width:100%;height:'+(h+16)+'px;display:block">'
    +'<path d="M'+up+' L'+lrv+' Z" fill="rgba(0,255,136,.06)"/>'
    +'<path d="M'+fc+'" fill="none" stroke="var(--g)" stroke-width="2"/>'
    +(ac.length?'<path d="M'+ac.join(' L')+'" fill="none" stroke="var(--mid)" stroke-width="1.5" stroke-dasharray="4 2"/>':'')
    +mo+'</svg>';
}

// ── Fetch RSS news ─────────────────────────────────────────────────────────
function fetchAllFeeds(){
  var active=feeds.filter(function(f){return f.on;});
  if(!active.length){S.newsError='No feeds enabled. Add feeds in News → Manage Sources.';renderSection();return;}
  S.newsLoading=true;S.newsError=null;S.articles=[];renderSection();
  var pending=active.length,collected=[];
  active.forEach(function(feed){
    fetch(PROXY+encodeURIComponent(feed.url)).then(function(r){return r.json();}).then(function(data){
      if(data.items){
        data.items.slice(0,8).forEach(function(item){
          collected.push({
            id:Math.random().toString(36).slice(2),
            headline:(item.title||'').trim(),
            source:feed.name,
            url:item.link||'',
            date:(item.pubDate||'').slice(0,10)||new Date().toISOString().slice(0,10),
            description:item.description?item.description.replace(/<[^>]*>/g,'').slice(0,300):'',
            cat:feed.cat,
            imgUrl:item.enclosure&&item.enclosure.link?item.enclosure.link:null
          });
        });
      }
    }).catch(function(e){console.warn('Feed failed:',feed.name,e.message);}).finally(function(){
      pending--;
      if(pending===0){
        S.articles=collected.sort(function(a,b){return b.date.localeCompare(a.date);});
        S.newsLoading=false;
        if(!S.articles.length)S.newsError='Could not load feeds. Check your internet connection or try different sources.';
        renderSection();
      }
    });
  });
}

async function sendMsg(msg){
  if(!msg||!msg.trim()||S.copilotLoading)return;
  S.msgs=S.msgs.concat([{role:'user',content:msg}]);S.copilotLoading=true;renderSection();
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are the Commercial Copilot for Angoalissar Lda, FMCG Angola. Revenue '+fmtM(KPI.rev)+' AOA, Volume '+fmt(KPI.vol)+' MT, Margin '+KPI.margin+'%. Scope: '+(S.province||'All Angola')+'. Be direct, analytical, action-oriented. Respond in English.',messages:S.msgs.slice(-20).map(function(m){return{role:m.role,content:m.content};})})});
    var data=await r.json();
    var reply=(data.content&&data.content.find(function(c){return c.type==='text';}))||null;
    S.msgs=S.msgs.concat([{role:'assistant',content:reply?reply.text:'No response.'}]);
  }catch(e){S.msgs=S.msgs.concat([{role:'assistant',content:'⚠ Anthropic API not configured. Wire your key to enable the Copilot.'}]);}
  S.copilotLoading=false;renderSection();
}

  // Briefing settings
  var bp=div('');bp.className='panel';bp.style.padding='20px';
  bp.innerHTML='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><span style="font-size:16px">🔔</span><span style="font-size:12px;font-weight:800;color:var(--tx);letter-spacing:1px">DAILY BRIEFING</span></div>'
    +'<div style="margin-bottom:14px"><div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;margin-bottom:6px">ENABLE</div><div id="btog" style="width:44px;height:24px;border-radius:12px;cursor:pointer;background:'+(s.briefingEnabled?'var(--c)':'var(--br)')+';border:1px solid '+(s.briefingEnabled?'var(--c)':'var(--br)')+';position:relative;transition:all .2s"><div style="position:absolute;top:3px;left:'+(s.briefingEnabled?22:3)+'px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:left .2s"></div></div></div>'
    +'<div><div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;margin-bottom:6px">TIME</div><input id="btime" type="time" value="'+s.briefingTime+'"'+(s.briefingEnabled?'':' disabled')+' style="background:var(--panel);border:1px solid var(--br);border-radius:8px;padding:7px 10px;color:'+(s.briefingEnabled?'var(--tx)':'var(--dim)')+';font-size:12px;font-family:var(--f);width:100%;opacity:'+(s.briefingEnabled?1:.4)+'"/></div>'
    +(s.briefingEnabled?'<div style="margin-top:12px;padding:8px 12px;background:var(--a)15;border:1px solid var(--a)30;border-radius:8px;font-size:10px;color:var(--a)">⏰ Briefing active at '+s.briefingTime+'</div>':'');
  g2.appendChild(bp);d.appendChild(g2);
  var sv=div('margin-top:14px;display:flex;justify-content:flex-end');
  var svb=btn('💾 Save Settings','padding:10px 24px;background:var(--g);color:var(--bg);border:none;border-radius:8px;font-size:11px;font-weight:800',function(){var ns={copilotMemory:parseInt(document.getElementById('mem').value)||10,devilTone:document.getElementById('tone').value||'moderate',briefingTime:document.getElementById('btime').value||'07:30',briefingEnabled:S.settings.briefingEnabled};S.settings=ns;try{localStorage.setItem('compass_settings',JSON.stringify(ns));}catch(e){}renderSection();});
  sv.appendChild(svb);d.appendChild(sv);
  requestAnimationFrame(function(){
    var m=document.getElementById('mem'),mv=document.getElementById('memv');if(m&&mv)m.oninput=function(){mv.textContent=this.value;};
    var bt=document.getElementById('btog');if(bt)bt.onclick=function(){S.settings.briefingEnabled=!S.settings.briefingEnabled;renderSection();};
  });
  return d;
}

// ── Sidebar ────────────────────────────────────────────────────────────────
var NAV=[{k:'overview',e:'⬛',l:'Overview'},{k:'commodities',e:'📈',l:'Commodities'},{k:'distributors',e:'👥',l:'Distributors'},{k:'profitability',e:'💹',l:'Profitability'},{k:'landed',e:'📦',l:'Landed Cost'},{k:'copilot',e:'🧠',l:'Copilot AI',badge:'AI'},{k:'briefings',e:'📋',l:'Briefings'},{k:'news',e:'📰',l:'News'},{k:'settings',e:'⚙️',l:'Settings'}];

function buildSidebar(col){
  var sb=div('');sb.className='sbr'+(col?' col':'');
  var logo=div(col?'padding:14px 0;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--br)':'padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--br)');
  if(!col){var lt=div('');lt.innerHTML='<div style="font-size:13px;font-weight:900;color:var(--c);letter-spacing:3px">COMPASS</div><div style="font-size:8px;color:var(--dim);font-weight:700;letter-spacing:2px">ANGOALISSAR · v2</div>';logo.appendChild(lt);}
  var tb=btn('☰','background:none;border:none;color:var(--dim);font-size:18px',function(){S.collapsed=!S.collapsed;render();});logo.appendChild(tb);sb.appendChild(logo);
  if(!col){var pp=div('padding:8px 12px;border-bottom:1px solid var(--br)');pp.appendChild(pill(S.province));sb.appendChild(pp);}
  var nav=div('flex:1;padding-top:6px');
  NAV.forEach(function(item){
    var isA=S.section===item.k;
    var nb=el('button','','');nb.className='nbtn'+(isA?' act':'')+(col?' col':'');
    if(isA){var bar=div('position:absolute;left:2px;top:18%;bottom:18%;width:2px;background:var(--c);border-radius:1px');nb.appendChild(bar);}
    var ico=div('font-size:15px');ico.textContent=item.e;nb.appendChild(ico);
    if(!col){var lbl=div('font-size:11px;font-weight:'+(isA?700:400)+';color:'+(isA?'var(--c)':'var(--dim)')+';flex:1;text-align:left;letter-spacing:.5px');lbl.textContent=item.l;nb.appendChild(lbl);}
    if(!col&&item.badge){var bdg=div('font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;background:var(--c);color:var(--bg);letter-spacing:1px');bdg.textContent=item.badge;nb.appendChild(bdg);}
    nb.onclick=function(){S.section=item.k;renderSection();var mob=document.getElementById('mobileSB');if(mob)mob.remove();};
    nav.appendChild(nb);
  });
  sb.appendChild(nav);
  if(!col){
    var feed=div('border-top:1px solid var(--br);padding:10px 12px');
    var fh=div('font-size:8px;color:var(--dim);font-weight:800;margin-bottom:8px;letter-spacing:2px');fh.textContent='◉ LIVE · '+(S.province?S.province.toUpperCase():'ALL');feed.appendChild(fh);
    S.articles.slice(0,3).forEach(function(n){
      var row=div('display:flex;gap:6px;margin-bottom:8px;align-items:flex-start');
      var dot=div('width:4px;height:4px;border-radius:50%;background:var(--c);margin-top:4px;flex-shrink:0');row.appendChild(dot);
      var nt=div('font-size:9px;color:var(--dim);line-height:1.4');nt.textContent=(n.headline||'').slice(0,52)+'…';row.appendChild(nt);feed.appendChild(row);
    });
    if(!S.articles.length){var nl=div('font-size:9px;color:var(--dim)');nl.textContent='Click News → Load Feeds';feed.appendChild(nl);}
    sb.appendChild(feed);
  }
  return sb;
}

// ── Ticker ─────────────────────────────────────────────────────────────────
function tickerHTML(){return S.fxRates.concat(S.fxRates).map(function(r){return '<span style="padding:0 18px;font-size:10px;border-right:1px solid var(--br);display:inline-flex;align-items:center;gap:7px"><span style="color:var(--dim);font-weight:700">'+r.pair+'</span><span style="color:var(--tx);font-weight:800">'+r.rate.toFixed(1)+'</span><span style="color:'+(r.chg>=0?'var(--g)':'var(--r)')+';font-size:9px">'+(r.chg>=0?'▲':'▼')+Math.abs(r.chg).toFixed(1)+'</span></span>';}).join('');}
var tOff=0,tRaf;
function startTicker(){if(tRaf)cancelAnimationFrame(tRaf);function run(){var inner=document.querySelector('.ticker-inner');if(inner){tOff-=.5;if(tOff<-inner.scrollWidth/2)tOff=0;inner.style.transform='translateX('+tOff+'px)';}tRaf=requestAnimationFrame(run);}tRaf=requestAnimationFrame(run);}
setInterval(function(){S.fxRates=S.fxRates.map(function(r){return{pair:r.pair,rate:parseFloat((r.rate+(Math.random()-.5)*.9).toFixed(1)),chg:parseFloat((r.chg+(Math.random()-.5)*.1).toFixed(2))};});var ti=document.querySelector('.ticker-inner');if(ti)ti.innerHTML=tickerHTML();},2800);

// ── Province helpers ──────────────────────────────────────────────────────
function setProv(p){S.province=p;try{p?localStorage.setItem('compass_province',p):localStorage.removeItem('compass_province');}catch(e){}render();}

function buildProvDD(parent){
  var existing=document.getElementById('provDD');if(existing){existing.remove();return;}
  var dd=div('position:absolute;top:110%;right:0;width:210px;z-index:200;padding:6px;max-height:280px;overflow-y:auto;border:1px solid var(--brh);box-shadow:0 8px 32px rgba(0,0,0,.6)');dd.id='provDD';dd.className='panel';
  var allb=btn('All Provinces','width:100%;padding:7px 10px;border-radius:6px;background:'+(!S.province?'var(--c)15':'transparent')+';border:none;color:'+(!S.province?'var(--c)':'var(--dim)')+';text-align:left;font-size:11px;font-weight:'+(!S.province?700:400),function(e){e.stopPropagation();setProv(null);dd.remove();});
  dd.appendChild(allb);
  PROVINCES.forEach(function(p){var pb=btn(p,'width:100%;padding:6px 10px;border-radius:6px;background:'+(S.province===p?'var(--c)12':'transparent')+';border:none;color:'+(S.province===p?'var(--c)':'var(--dim)')+';text-align:left;font-size:10px;font-weight:'+(S.province===p?700:400),function(e){e.stopPropagation();setProv(p);dd.remove();});dd.appendChild(pb);});
  parent.style.position='relative';parent.appendChild(dd);
  setTimeout(function(){document.addEventListener('click',function rm(){dd.remove();document.removeEventListener('click',rm);});},10);
}

// ── Modals ─────────────────────────────────────────────────────────────────
function openCSV(){
  var prov=S.province,prices=prov?ALL_PRICES.filter(function(p){return p.province===prov;}):ALL_PRICES;
  var mb=div('');mb.className='modal';
  var box=div('');box.className='panel mbox';
  var hrow=div('display:flex;justify-content:space-between;align-items:center;margin-bottom:14px');
  var ht=div('font-size:14px;font-weight:900;color:var(--tx)');ht.textContent='EXPORT CSV';hrow.appendChild(ht);
  var xb=btn('✕ Close','background:none;border:1px solid var(--br);border-radius:6px;padding:5px 12px;color:var(--tx);font-size:12px',function(){mb.remove();});hrow.appendChild(xb);box.appendChild(hrow);
  box.appendChild(pill(prov));
  var info=div('font-size:10px;color:var(--dim);margin:10px 0');info.textContent=prices.length+' rows';box.appendChild(info);
  var prev=div('overflow-x:auto;background:var(--panel);border-radius:8px;padding:10px;margin-bottom:14px;border:1px solid var(--br)');
  var tbl=document.createElement('table');var cols=['province','commodity','price','currency','unit'];
  tbl.innerHTML='<thead><tr>'+cols.map(function(c){return '<th style="color:var(--c)">'+c+'</th>';}).join('')+'</tr></thead>';
  var tb=document.createElement('tbody');prices.slice(0,5).forEach(function(r){var tr=document.createElement('tr');tr.innerHTML=cols.map(function(c){return '<td style="font-size:10px;padding:4px 10px">'+r[c]+'</td>';}).join('');tb.appendChild(tr);});tbl.appendChild(tb);prev.appendChild(tbl);box.appendChild(prev);
  var dlb=btn('⬇ Download CSV','padding:10px 22px;background:var(--c);color:var(--bg);border:none;border-radius:8px;font-size:11px;font-weight:800',function(){var csv=[cols.join(',')].concat(prices.map(function(r){return cols.map(function(c){return r[c];}).join(',');})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='compass_'+(prov||'all')+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();mb.remove();});
  box.appendChild(dlb);mb.appendChild(box);mb.onclick=function(e){if(e.target===mb)mb.remove();};document.body.appendChild(mb);
}

function openPPTX(){
  var prov=S.province;
  var mb=div('');mb.className='modal';
  var box=div('');box.className='panel mbox';box.style.cssText='max-width:500px;padding:24px;border:1px solid var(--brh)';
  var hrow=div('display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px');
  var ht=div('');ht.innerHTML='<div style="font-size:15px;font-weight:900;color:var(--tx);letter-spacing:1px">BOARD PRESENTATION</div><div style="font-size:10px;color:var(--dim);margin-top:3px">Export to PowerPoint</div>';hrow.appendChild(ht);
  var xb=btn('✕ Close','background:none;border:1px solid var(--br);border-radius:6px;padding:5px 12px;color:var(--tx);font-size:12px',function(){mb.remove();});hrow.appendChild(xb);box.appendChild(hrow);
  box.appendChild(pill(prov));
  var slides=[['📊','Executive Summary','Revenue, volume, margin, DSO KPIs'],['💹','Market Prices','Commodity prices by province'],['👥','Distributor Performance','Rankings, scorecards, radar'],['📈','Profitability Analysis','Margin by brand, region, channel, SKU'],['⚡','Risks & Opportunities','Market intelligence and competition'],['🎯','Action Plan','3 priority commercial actions']];
  var sl=div('margin:14px 0');slides.forEach(function(s,i){sl.innerHTML+='<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;background:var(--c)08;border:1px solid var(--br);border-radius:8px;margin-bottom:7px"><span style="font-size:17px">'+s[0]+'</span><div><div style="font-size:12px;font-weight:700;color:var(--tx)">Slide '+(i+1)+': '+s[1]+'</div><div style="font-size:10px;color:var(--dim)">'+s[2]+'</div></div></div>';});
  box.appendChild(sl);
  var eb=btn('📊 Export PPTX','width:100%;padding:12px;background:var(--c);color:var(--bg);border:none;border-radius:10px;font-size:12px;font-weight:800',function(){var lines=['ANGOALISSAR COMPASS — BOARD PRESENTATION','Generated: '+new Date().toLocaleString('en-GB'),'Scope: '+(prov||'All Angola'),''].concat(slides.map(function(s,i){return 'SLIDE '+(i+1)+': '+s[1]+'\n'+s[2];}));var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='Angoalissar_Board_'+(prov||'Angola')+'_'+new Date().toISOString().slice(0,10)+'.txt';a.click();mb.remove();});
  box.appendChild(eb);mb.appendChild(box);mb.onclick=function(e){if(e.target===mb)mb.remove();};document.body.appendChild(mb);
}

// ── Section renderer ──────────────────────────────────────────────────────
function renderSection(){
  var mc=document.getElementById('mc');if(!mc)return;mc.innerHTML='';
  var fns={overview:renderOverview,commodities:renderCommodities,distributors:renderDistributors,profitability:renderProfitability,landed:renderLandedCost,copilot:renderCopilot,briefings:renderBriefings,news:renderNews,settings:renderSettings};
  var fn=fns[S.section];if(fn)mc.appendChild(fn());
}

function render(){
  var app=document.getElementById('app');app.innerHTML='';
  // Sidebar (desktop)
  var sbc=div('position:relative;z-index:10');sbc.style.display='none';sbc.className='sbc';sbc.appendChild(buildSidebar(S.collapsed));app.appendChild(sbc);
  // Main
  var main=document.createElement('main');
  // Topbar
  var tb=div('');tb.className='topbar';
  var tl=div('display:flex;align-items:center;gap:10px');
  // Mobile menu button
  var mob=btn('☰','background:none;border:none;color:var(--c);font-size:20px;display:none',function(){
    var existing=document.getElementById('mobileSB');if(existing){existing.remove();return;}
    var ov=div('position:fixed;inset:0;z-index:200');ov.id='mobileSB';
    var bg=div('position:absolute;inset:0;background:rgba(0,0,0,.75)');bg.onclick=function(){ov.remove();};
    var msb=buildSidebar(false);msb.style.cssText='position:absolute;left:0;top:0;bottom:0;display:flex!important';
    ov.appendChild(bg);ov.appendChild(msb);document.body.appendChild(ov);
  });mob.className='mob-btn';tl.appendChild(mob);
  var secName=NAV.find(function(n){return n.k===S.section;});
  var si=div('');si.innerHTML='<div style="font-size:13px;font-weight:800;color:var(--tx);letter-spacing:1px">'+((secName&&secName.l)||'').toUpperCase()+'</div><div style="font-size:9px;color:var(--dim);letter-spacing:1px">'+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div>';
  tl.appendChild(si);tb.appendChild(tl);
  var tr=div('display:flex;gap:7px;align-items:center;flex-wrap:wrap');
  // Theme switcher in topbar
  var thDiv=div('display:flex;gap:3px');
  [['dark','🌑'],['light','☀️'],['neon','🟣']].forEach(function(ti){var tb2=btn(ti[1],'padding:5px 8px;border-radius:6px;font-size:14px;background:'+(S.theme===ti[0]?'var(--c)':'var(--panel)')+';border:1px solid '+(S.theme===ti[0]?'var(--c)':'var(--br)'),function(){applyTheme(ti[0],true);});thDiv.appendChild(tb2);});
  tr.appendChild(thDiv);
  var pw=div('');pw.style.position='relative';
  var pb=btn('','display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--mid);font-size:10px',function(e){e.stopPropagation();buildProvDD(pw);});
  pb.innerHTML='📍 <span style="color:var(--tx);font-weight:700">'+(S.province||'ALL')+'</span> ▾';pw.appendChild(pb);tr.appendChild(pw);
  var pptxB=btn('📊 PPTX','padding:6px 11px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--c);font-size:10px;font-weight:700',openPPTX);tr.appendChild(pptxB);
  var csvB=btn('⬇ CSV','padding:6px 11px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--c);font-size:10px;font-weight:700',openCSV);tr.appendChild(csvB);
  tb.appendChild(tr);main.appendChild(tb);
  // FX Ticker
  var ticker=div('');ticker.className='ticker';ticker.innerHTML='<div class="ticker-inner" style="display:flex;white-space:nowrap">'+tickerHTML()+'</div>';main.appendChild(ticker);
  // Province pill
  var ppRow=div('padding:10px 20px 0;display:flex;align-items:center;gap:8px');ppRow.appendChild(pill(S.province));
  if(S.province){var clr=btn('✕ Clear','background:none;border:none;color:var(--dim);font-size:9px',function(){setProv(null);});ppRow.appendChild(clr);}
  main.appendChild(ppRow);
  // Content
  var mc=div('');mc.id='mc';mc.className='content';main.appendChild(mc);
  app.appendChild(main);
  // CSS for desktop sidebar visibility
  var style=document.createElement('style');style.textContent='@media(min-width:769px){.sbc{display:block!important}.mob-btn{display:none!important}}';document.head.appendChild(style);
  renderSection();requestAnimationFrame(startTicker);
}

render();
</script>
</body>
