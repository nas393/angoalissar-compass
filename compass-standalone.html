<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Angoalissar Compass</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#010810;--panel:rgba(0,14,28,.85);--br:rgba(0,220,255,.12);--brh:rgba(0,220,255,.5);
  --tx:#e0f7ff;--mid:#7aacbc;--dim:#3a6070;
  --c:#00e5ff;--cd:#00b8cc;--g:#00ff88;--a:#ffaa00;--r:#ff3b5c;--b:#0055ff;
  --sb-bg:rgba(0,5,14,.97);--top-bg:rgba(1,8,20,.92);
  --f:'IBM Plex Mono','Courier New',monospace;
}
body.light{
  --bg:#f0f4f8;--panel:rgba(255,255,255,.92);--br:rgba(0,120,180,.15);--brh:rgba(0,120,180,.5);
  --tx:#0a1628;--mid:#2a4a6a;--dim:#6a8aaa;
  --sb-bg:rgba(240,248,255,.98);--top-bg:rgba(240,248,255,.95);
  --c:#0055cc;--cd:#0044aa;--g:#007744;--a:#cc7700;--r:#cc2244;
}
body.neon{
  --bg:#000510;--panel:rgba(0,0,20,.9);--br:rgba(255,0,255,.2);--brh:rgba(255,0,255,.6);
  --tx:#ffe0ff;--mid:#cc88cc;--dim:#664466;
  --c:#ff00ff;--cd:#cc00cc;--g:#00ffaa;--a:#ffdd00;--r:#ff2244;
  --sb-bg:rgba(10,0,20,.98);--top-bg:rgba(5,0,15,.95);
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--c);opacity:.3;border-radius:2px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .25s ease}
.panel{background:var(--panel);border:1px solid var(--br);border-radius:12px;backdrop-filter:blur(14px)}
button{cursor:pointer;transition:opacity .15s;font-family:var(--f)}
button:hover{opacity:.85}
input:focus,select:focus{outline:none;border-color:var(--c)!important}
select option{background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:220px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--sb-bg);border-right:1px solid var(--br);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s ease,background .3s;z-index:10}
.sidebar.collapsed{width:58px}
main{flex:1;min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;background:var(--top-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--br);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;transition:background .3s}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-2l{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.content{padding:18px 22px 56px}
.ticker-wrap{overflow:hidden;border-top:1px solid var(--br);border-bottom:1px solid var(--br);height:26px;display:flex;align-items:center;background:var(--sb-bg)}
.ticker-inner{display:flex;white-space:nowrap}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;transition:all .12s;position:relative;color:var(--dim);font-size:11px;font-family:var(--f);letter-spacing:.5px}
.nav-btn.active{background:rgba(0,229,255,.08);border-left-color:var(--c);color:var(--c)}
body.light .nav-btn.active{background:rgba(0,85,204,.08)}
body.neon .nav-btn.active{background:rgba(255,0,255,.08)}
.nav-btn.cbtn{justify-content:center;padding:10px 0}
.tab-btn{padding:5px 16px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--f);border:1px solid var(--br);background:rgba(0,180,220,.04);color:var(--dim);letter-spacing:.5px;transition:all .15s}
.tab-btn.active{background:rgba(0,229,255,.18);border-color:var(--c);color:var(--c)}
body.light .tab-btn.active{background:rgba(0,85,204,.12)}
body.neon .tab-btn.active{background:rgba(255,0,255,.18)}
table{width:100%;border-collapse:collapse}
th{padding:8px 12px;text-align:left;color:var(--dim);font-weight:700;font-size:9px;letter-spacing:1px;background:rgba(0,229,255,.06)}
body.light th{background:rgba(0,85,204,.06)}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(0,220,255,.06);color:var(--tx)}
body.light td{border-bottom-color:rgba(0,85,204,.08)}
.province-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-box{padding:26px;width:100%;max-width:520px}
.mob-btn{display:none}
/* Static theme backgrounds */
body .bg-static{position:fixed;inset:0;z-index:0;pointer-events:none}
body.light .bg-static{background:linear-gradient(135deg,#dbeafe 0%,#ede9fe 50%,#d1fae5 100%)}
body.neon .bg-static{background:radial-gradient(ellipse at 20% 20%,#1a0030 0%,#000510 40%,#001020 100%)}
body:not(.light):not(.neon) .bg-static{background:linear-gradient(160deg,#010810 0%,#020c1a 60%,#010810 100%)}
/* Side panel */
#sidePanel{position:fixed;top:0;right:-420px;width:420px;height:100vh;z-index:500;overflow-y:auto;transition:right .3s ease;background:var(--sb-bg);border-left:1px solid var(--brh);padding:24px;box-shadow:-8px 0 32px rgba(0,0,0,.5)}
#sidePanel.open{right:0}
/* News card clickable */
.news-card{cursor:pointer;transition:border-color .15s,transform .1s}
.news-card:hover{border-color:var(--c)!important;transform:translateX(2px)}
@media(max-width:768px){
  .sidebar{display:none!important}
  .mob-btn{display:flex!important}
  .grid-3{grid-template-columns:1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .grid-2l{grid-template-columns:1fr!important}
  .kpi-grid{grid-template-columns:repeat(2,1fr)!important}
  #sidePanel{width:100%}
}
</style>
</head>
<body>
<div class="bg-static" id="bgStatic"></div>
<div id="app"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
var PROVINCES=['Luanda','Benguela','Huila','Cabinda','Cuanza Norte','Cuanza Sul','Malanje','Lunda Norte','Namibe','Uige','Huambo','Bie','Cunene','Moxico','Zaire','Bengo','Lunda Sul','Cuando Cubango'];
var COMMODITIES=['Rice','Maize','Beans','Oil','Sugar','Flour'];
var BRANDS=['Madrugada','Aguia','Stallion','Patriota','Uncle Sam'];
var REGIONS=['Luanda','Benguela','Huambo','Lobito','Lubango','Cabinda','Namibe','Uige'];
var CHANNELS=['Wholesale','Retail','HoReCa','Modern Trade'];
var PR={Rice:[400,800],Maize:[200,500],Beans:[600,1200],Oil:[1000,2000],Sugar:[500,1000],Flour:[300,700]};
var SENT_COLOR={positive:'#00bb66',neutral:'#cc8800',negative:'#cc2244'};
var CAT_COLOR={macro:'#0099cc',commodity:'#cc8800',competitor:'#cc2244',regulatory:'#00aa55'};

// Real-ish news with actual source URLs
var NEWS=[
  {id:'n1',headline:'BNA holds base interest rate at 19.50% — commercial credit conditions unchanged',source:'BNA — Banco Nacional de Angola',url:'https://www.bna.ao',date:'2026-05-22',cat:'macro',sent:'neutral',prov:'Luanda'},
  {id:'n2',headline:'Rice prices surge 8% in Luanda informal markets amid supply tightening',source:'Jornal de Angola',url:'https://www.jornaldeangola.ao',date:'2026-05-21',cat:'commodity',sent:'negative',prov:'Luanda'},
  {id:'n3',headline:'Sodosa announces distribution expansion into Malanje and Bié provinces',source:'Expansão',url:'https://expansao.ao',date:'2026-05-20',cat:'competitor',sent:'negative',prov:null},
  {id:'n4',headline:'MINFIN confirms temporary AOA 2/kg wheat flour consumer subsidy through Q3',source:'Ministério das Finanças',url:'https://www.minfin.gov.ao',date:'2026-05-20',cat:'regulatory',sent:'positive',prov:null},
  {id:'n5',headline:'Kwanza closes stable at 878.4 per dollar — BNA intervention noted',source:'BNA — Banco Nacional de Angola',url:'https://www.bna.ao',date:'2026-05-19',cat:'macro',sent:'neutral',prov:null},
  {id:'n6',headline:'Huambo maize harvest exceeds MINAGRIF forecast by 12% — seasonal price pressure building',source:'MINAGRIF',url:'https://www.minagrif.gov.ao',date:'2026-05-18',cat:'commodity',sent:'positive',prov:'Huambo'},
  {id:'n7',headline:'Noble Group enters Angola packaged flour market with 25kg SKU targeting modern trade',source:'Expansão',url:'https://expansao.ao',date:'2026-05-17',cat:'competitor',sent:'negative',prov:null},
  {id:'n8',headline:'Kero and Candando sign exclusive pricing agreements with three domestic sugar suppliers',source:'Mercado',url:'https://mercado.co.ao',date:'2026-05-16',cat:'competitor',sent:'negative',prov:'Luanda'},
  {id:'n9',headline:'Port of Luanda handling volumes up 6.4% — import throughput recovering post-Q1 congestion',source:'ANPG',url:'https://www.anpg.ao',date:'2026-05-15',cat:'macro',sent:'positive',prov:'Luanda'},
  {id:'n10',headline:'AGT strengthens customs controls on cereal imports — processing times increase 3–5 days',source:'AGT — Autoridade Geral Tributária',url:'https://www.agt.minfin.gov.ao',date:'2026-05-14',cat:'regulatory',sent:'negative',prov:null}
];

// RSS feed sources (CORS-proxied — swap proxy when deploying to your backend)
var RSS_SOURCES=[
  {name:'Jornal de Angola',url:'https://www.jornaldeangola.ao',feed:'https://api.rss2json.com/v1/api.json?rss_url=https://www.jornaldeangola.ao/feed'},
  {name:'Expansão',url:'https://expansao.ao',feed:'https://api.rss2json.com/v1/api.json?rss_url=https://expansao.ao/feed'},
  {name:'BNA',url:'https://www.bna.ao',feed:null}
];

var KPI={rev:2840000000,vol:21868,margin:6.4,cust:312,dso:38,region:'Luanda',growth:4.2,mvt:-2.1};
var FX=[{pair:'USD/AOA',rate:878.4,chg:.3},{pair:'EUR/AOA',rate:953.2,chg:-.8},{pair:'CNY/AOA',rate:121.3,chg:.1},{pair:'GBP/AOA',rate:1112.7,chg:1.2},{pair:'BRL/AOA',rate:159.6,chg:-.4}];

var ALL_PRICES=[];
PROVINCES.forEach(function(p){COMMODITIES.forEach(function(c){ALL_PRICES.push({province:p,commodity:c,price:(PR[c][0]+Math.floor(Math.random()*(PR[c][1]-PR[c][0]))),currency:'AOA',unit:'kg'});});});

function genHistory(commodity){
  var base=500,arr=[];
  for(var i=0;i<ALL_PRICES.length;i++){if(ALL_PRICES[i].commodity===commodity){base=ALL_PRICES[i].price;break;}}
  var price=base*.85;
  for(var d=60;d>=0;d--){var dt=new Date();dt.setDate(dt.getDate()-d);price+=(Math.random()-.5)*base*.04;arr.push({date:dt.toISOString().slice(0,10),price:Math.round(price)});}
  return arr;
}
function genForecast(commodity){
  var base=500;
  for(var i=0;i<ALL_PRICES.length;i++){if(ALL_PRICES[i].commodity===commodity){base=ALL_PRICES[i].price;break;}}
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],cur=new Date().getMonth();
  return months.map(function(m,i){return{month:m,actual:i<=cur?Math.round(base*(1+(i-5)*.006)+(Math.random()-.5)*base*.04):null,forecast:Math.round(base*(1+(i-5)*.007)),upper:Math.round(base*(1+(i-5)*.007)*1.07),lower:Math.round(base*(1+(i-5)*.007)*.93)};});
}

var DISTRIBUTORS=[];
['Norte Distributors','Sul Commerce','Benguela Trade','Luanda Wholesale','Cabinda Supply','Huambo Distrib','Lobito Commerce','Namibe Traders'].forEach(function(name,i){
  var s=55+Math.floor(Math.random()*60),pr=4+Math.random()*14,co=70+Math.floor(Math.random()*28),cv=55+Math.floor(Math.random()*40),gr=-5+Math.random()*27;
  var score=Math.min(Math.round((Math.min(s,100)*.3+pr*2+co*.25+cv*.2+Math.max(gr+5,0)*1.5)/1.5),100);
  DISTRIBUTORS.push({id:i,name:name,region:REGIONS[i%8],sales:s,profit:parseFloat(pr.toFixed(1)),collect:co,coverage:cv,growth:parseFloat(gr.toFixed(1)),score:score,rank:0});
});
DISTRIBUTORS.sort(function(a,b){return b.score-a.score;});
DISTRIBUTORS.forEach(function(d,i){d.rank=i+1;});

var SKU_MARGINS=[];
['Madrugada Flour 50kg','Aguia Flour 25kg','Stallion Flour 50kg','Patriota Rice 25kg','Uncle Sam Rice 5kg','Sugar 50kg','Beans 25kg','Oil 5L'].forEach(function(sku){
  REGIONS.slice(0,4).forEach(function(region){
    var rev=80000+Math.floor(Math.random()*420000),cp=.79+Math.random()*.17;
    SKU_MARGINS.push({sku:sku,brand:BRANDS[Math.floor(Math.random()*5)],region:region,channel:CHANNELS[Math.floor(Math.random()*4)],rev:rev,cost:Math.round(rev*cp),margin:parseFloat(((1-cp)*100).toFixed(1))});
  });
});

// ── Commodity prices: manual entry support ─────────────────────────────────
var MANUAL_PRICES={};
try{var mp=localStorage.getItem('compass_manual_prices');if(mp)MANUAL_PRICES=JSON.parse(mp);}catch(e){}

function saveManualPrice(province,commodity,price){
  var key=province+'__'+commodity;
  MANUAL_PRICES[key]={province:province,commodity:commodity,price:parseFloat(price),source:'Manual Entry',date:new Date().toISOString().slice(0,10)};
  try{localStorage.setItem('compass_manual_prices',JSON.stringify(MANUAL_PRICES));}catch(e){}
  // update ALL_PRICES
  for(var i=0;i<ALL_PRICES.length;i++){
    if(ALL_PRICES[i].province===province&&ALL_PRICES[i].commodity===commodity){ALL_PRICES[i].price=parseFloat(price);ALL_PRICES[i].source='Manual';break;}
  }
}

// ── State ──────────────────────────────────────────────────────────────────
var S={
  section:'overview',province:null,collapsed:false,
  commodity:'Rice',groupBy:'brand',newsCat:null,newsDateFrom:'',newsDateTo:'',
  copilotTab:'chat',copilotTone:'moderate',copilotHorizon:'30 days',
  msgs:[],copilotLoading:false,
  landed:{baseCostUSD:18.5,freightUSD:2.8,customsDuty:10,fxRate:870,otherCosts:500,sellingPrice:24500},
  settings:{copilotMemory:10,devilTone:'moderate',briefingEnabled:false,briefingTime:'07:30'},
  briefings:[],histCache:{},fcastCache:{},fxRates:JSON.parse(JSON.stringify(FX)),
  theme:'dark',newsFeed:JSON.parse(JSON.stringify(NEWS)),newsLoading:false,
  openArticle:null,priceEntryMode:false
};
try{var ss=localStorage.getItem('compass_settings');if(ss)S.settings=Object.assign(S.settings,JSON.parse(ss));}catch(e){}
try{var sp=localStorage.getItem('compass_province');if(sp)S.province=sp;}catch(e){}
try{var sb=localStorage.getItem('compass_briefings');if(sb)S.briefings=JSON.parse(sb);}catch(e){}
try{var st=localStorage.getItem('compass_theme');if(st)S.theme=st;}catch(e){}
COMMODITIES.forEach(function(c){S.histCache[c]=genHistory(c);S.fcastCache[c]=genForecast(c);});
applyTheme(S.theme);

function applyTheme(t){
  document.body.className=t==='light'?'light':t==='neon'?'neon':'';
  S.theme=t;
  try{localStorage.setItem('compass_theme',t);}catch(e){}
}

// FX live simulation
setInterval(function(){
  S.fxRates=S.fxRates.map(function(r){return{pair:r.pair,rate:parseFloat((r.rate+(Math.random()-.5)*.9).toFixed(1)),chg:parseFloat((r.chg+(Math.random()-.5)*.1).toFixed(2))};});
  var ti=document.querySelector('.ticker-inner');if(ti)ti.innerHTML=buildTickerHTML();
},2800);

// ── Fetch real RSS news ────────────────────────────────────────────────────
function fetchRSSNews(){
  S.newsLoading=true;
  var fetched=[];
  var pending=0;
  RSS_SOURCES.filter(function(s){return s.feed;}).forEach(function(src){
    pending++;
    fetch(src.feed).then(function(r){return r.json();}).then(function(data){
      if(data.items){
        data.items.slice(0,5).forEach(function(item){
          fetched.push({
            id:'rss_'+Math.random().toString(36).slice(2),
            headline:item.title,
            source:src.name,
            url:item.link||src.url,
            date:(item.pubDate||'').slice(0,10)||new Date().toISOString().slice(0,10),
            cat:'macro',sent:'neutral',prov:null,
            description:item.description||''
          });
        });
      }
    }).catch(function(){}).finally(function(){
      pending--;
      if(pending===0){
        if(fetched.length>0){
          S.newsFeed=fetched.concat(NEWS);
        }
        S.newsLoading=false;
        if(S.section==='news')renderSection();
      }
    });
  });
  if(pending===0){S.newsLoading=false;}
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(n){return(n||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function fmtM(n){return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':fmt(n);}
function glow(c,s){s=s||12;return '0 0 '+s+'px '+c+'40,0 0 '+(s*2)+'px '+c+'18';}

function div(cls,html,styleStr){var d=document.createElement('div');if(cls)d.className=cls;if(html!==undefined&&html!==null&&html!=='')d.innerHTML=html;if(styleStr)d.style.cssText=styleStr;return d;}
function btn(text,cls,styleStr,onclick){var b=document.createElement('button');if(typeof text==='string')b.textContent=text;if(cls)b.className=cls;if(styleStr)b.style.cssText=styleStr;if(onclick)b.addEventListener('click',onclick);return b;}
function inp(type,val,styleStr,oninput){var i=document.createElement('input');i.type=type;if(val!==undefined&&val!==null)i.value=val;if(styleStr)i.style.cssText=styleStr;if(oninput)i.addEventListener('input',oninput);return i;}
function span(text,styleStr){var s=document.createElement('span');s.textContent=text;if(styleStr)s.style.cssText=styleStr;return s;}

function provincePill(prov){
  var color=prov?'var(--a)':'var(--cd)';
  var d=div('province-pill');d.style.cssText='background:'+color.replace('var','rgba')+'12;border:1px solid '+color+'30;color:'+color;
  d.innerHTML='&#128205; '+(prov?prov.toUpperCase():'ALL PROVINCES');return d;
}

function sectionHeader(title,sub,prov){
  var d=div('');d.style.marginBottom='20px';
  var h2=document.createElement('h2');h2.textContent=title;h2.style.cssText='font-size:18px;font-weight:900;color:var(--tx);letter-spacing:1px';d.appendChild(h2);
  if(sub){var p=document.createElement('p');p.textContent=sub;p.style.cssText='font-size:11px;color:var(--dim);margin-top:3px';d.appendChild(p);}
  var pw=div('');pw.style.marginTop='8px';pw.appendChild(provincePill(prov));d.appendChild(pw);return d;
}

function kpiCard(label,value,sub,trend,accent,emoji){
  var c=div('panel','','padding:16px 18px;position:relative;overflow:hidden');
  c.innerHTML='<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,'+accent+',transparent);opacity:.6"></div>'
    +'<div style="position:absolute;top:10px;right:12px;opacity:.15;font-size:26px">'+emoji+'</div>'
    +'<div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px">'+label+'</div>'
    +'<div style="font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.5px">'+value+'</div>';
  if(sub||trend!==undefined){
    var r=div('','','margin-top:4px;display:flex;align-items:center;gap:8px;font-size:11px');
    if(sub){var sd=span(sub,'color:var(--dim)');r.appendChild(sd);}
    if(trend!==undefined){var td=span((trend>0?'▲':trend<0?'▼':'— ')+Math.abs(trend).toFixed(1)+'%','font-weight:700;color:'+(trend>0?'var(--g)':trend<0?'var(--r)':'var(--dim)'));r.appendChild(td);}
    c.appendChild(r);
  }
  return c;
}

// ── SVG Charts ─────────────────────────────────────────────────────────────
function pathPoints(vals,w,h){
  if(!vals.length)return'';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),range=mx-mn||1;
  return vals.map(function(v,i){return(i===0?'M':'L')+(i/(vals.length-1)*w)+','+(h-(v-mn)/range*h);}).join(' ');
}
function areaChart(data,key,color,w,h){
  w=w||280;h=h||120;
  var vals=data.map(function(d){return d[key];}).filter(function(v){return v!=null;});
  if(!vals.length)return '';
  var p=pathPoints(vals,w,h),id='ag'+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="'+color+'" stop-opacity=".2"/><stop offset="95%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+p+' L'+w+','+h+' L0,'+h+' Z" fill="url(#'+id+')" />'
    +'<path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}
function barChart(labels,vals,color,w,h){
  w=w||280;h=h||130;color=color||'var(--c)';
  if(!vals.length)return '';
  var mx=Math.max.apply(null,vals)||1,bw=Math.floor(w/vals.length*.65),gap=Math.floor(w/vals.length),bars='';
  vals.forEach(function(v,i){
    var bh=Math.round((v/mx)*(h-4)),x=i*gap+(gap-bw)/2,y=h-bh;
    bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+color+'"/>';
    bars+='<text x="'+(x+bw/2)+'" y="'+(h+14)+'" text-anchor="middle" fill="var(--dim)" font-size="9" font-family="monospace">'+(labels[i]||'').slice(0,5)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+(h+18)+'" style="width:100%;height:'+(h+18)+'px;display:block">'+bars+'</svg>';
}
function radarChart(items,color,size){
  size=size||180;color=color||'var(--c)';if(!items.length)return '';
  var cx=size/2,cy=size/2,r=size*.38,n=items.length;
  function pt(i,v){var a=i/n*Math.PI*2-Math.PI/2;return{x:cx+Math.cos(a)*v,y:cy+Math.sin(a)*v};}
  var polyPts=items.map(function(d,i){var p=pt(i,r*d.v/100);return p.x+','+p.y;}).join(' ');
  var axes='',grid='',labels='';
  [.25,.5,.75,1].forEach(function(lvl){var gp=items.map(function(d,i){var p=pt(i,r*lvl);return p.x+','+p.y;}).join(' ');grid+='<polygon points="'+gp+'" fill="none" stroke="var(--br)" stroke-width=".5"/>';});
  items.forEach(function(d,i){var p=pt(i,r),lp=pt(i,r+18);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x+'" y2="'+p.y+'" stroke="var(--br)" stroke-width=".5"/>';labels+='<text x="'+lp.x+'" y="'+lp.y+'" text-anchor="middle" dominant-baseline="middle" fill="var(--dim)" font-size="9" font-family="monospace">'+d.s+'</text>';});
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:100%;height:'+size+'px;display:block">'+grid+axes+'<polygon points="'+polyPts+'" fill="'+color+'18" stroke="'+color+'" stroke-width="1.5"/>'+labels+'</svg>';
}
function forecastChart(data,w,h){
  w=w||280;h=h||150;if(!data.length)return '';
  var allV=[];data.forEach(function(d){if(d.upper)allV.push(d.upper);if(d.lower)allV.push(d.lower);});
  var mn=Math.min.apply(null,allV)*.97,mx=Math.max.apply(null,allV)*1.03,range=mx-mn||1;
  function px(i,v){return(i/(data.length-1)*w)+','+(h-(v-mn)/range*h);}
  var upper=data.map(function(d,i){return px(i,d.upper);}).join(' L');
  var lowerR=data.slice().reverse().map(function(d,i){return px(data.length-1-i,d.lower);}).join(' L');
  var fcast=data.map(function(d,i){return px(i,d.forecast);}).join(' L');
  var actualPts=data.filter(function(d){return d.actual;}).map(function(d,i){return px(i,d.actual);});
  var months=data.map(function(d,i){return '<text x="'+(i/(data.length-1)*w)+'" y="'+(h+12)+'" text-anchor="middle" fill="var(--dim)" font-size="8" font-family="monospace">'+d.month+'</text>';}).join('');
  return '<svg viewBox="0 0 '+w+' '+(h+16)+'" style="width:100%;height:'+(h+16)+'px;display:block">'
    +'<path d="M'+upper+' L'+lowerR+' Z" fill="rgba(0,255,136,.07)"/>'
    +'<path d="M'+fcast+'" fill="none" stroke="var(--g)" stroke-width="2"/>'
    +(actualPts.length?'<path d="M'+actualPts.join(' L')+'" fill="none" stroke="var(--mid)" stroke-width="1.5" stroke-dasharray="4 2"/>':'')
    +months+'</svg>';
}

async function sendMsg(msg){
  if(!msg||!msg.trim()||S.copilotLoading)return;
  S.msgs=S.msgs.concat([{role:'user',content:msg}]);S.copilotLoading=true;renderSection();
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are the Commercial Copilot for Angoalissar Lda, FMCG Angola. Revenue '+fmtM(KPI.rev)+' AOA, Volume '+fmt(KPI.vol)+' MT, Margin '+KPI.margin+'%. Scope: '+(S.province||'All Angola')+'. Be direct and action-oriented. Respond in English.',messages:S.msgs.slice(-20).map(function(m){return{role:m.role,content:m.content};})})});
    var data=await r.json();
    var reply=(data.content&&data.content.find(function(c){return c.type==='text';}))?data.content.find(function(c){return c.type==='text';}).text:'No response.';
    S.msgs=S.msgs.concat([{role:'assistant',content:reply}]);
  }catch(e){S.msgs=S.msgs.concat([{role:'assistant',content:'⚠ Anthropic API not configured. Wire your key to enable the Copilot.'}]);}
  S.copilotLoading=false;renderSection();
}

    +'<div><div style="font-size:9px;color:var(--dim);font-weight:700;letter-spacing:1.5px;margin-bottom:7px">BRIEFING TIME</div><input id="timeInput" type="time" value="'+s.briefingTime+'"'+(s.briefingEnabled?'':' disabled')+' style="background:var(--panel);border:1px solid var(--br);border-radius:8px;padding:8px 10px;color:'+(s.briefingEnabled?'var(--tx)':'var(--dim)')+';font-size:12px;width:100%;font-family:var(--f);opacity:'+(s.briefingEnabled?1:.4)+'"/></div>'
    +(s.briefingEnabled?'<div style="margin-top:12px;padding:8px 12px;background:var(--a)15;border:1px solid var(--a)30;border-radius:8px;font-size:10px;color:var(--a);line-height:1.5">⏰ Daily briefing active at '+s.briefingTime+'</div>':'');
  g2.appendChild(bp);d.appendChild(g2);
  var sv=div('','','margin-top:14px;display:flex;justify-content:flex-end');
  var svb=btn('💾 SAVE SETTINGS','','padding:10px 24px;background:var(--g);color:var(--bg);border:none;border-radius:8px;font-size:11px;font-weight:800;font-family:var(--f)');
  svb.addEventListener('click',function(){var ns={copilotMemory:parseInt(document.getElementById('memSlider').value)||10,devilTone:document.getElementById('toneSelect').value||'moderate',briefingTime:document.getElementById('timeInput').value||'07:30',briefingEnabled:S.settings.briefingEnabled};S.settings=ns;try{localStorage.setItem('compass_settings',JSON.stringify(ns));}catch(e){}renderSection();});
  sv.appendChild(svb);d.appendChild(sv);
  requestAnimationFrame(function(){
    var sl=document.getElementById('memSlider'),mv=document.getElementById('memVal');
    if(sl&&mv)sl.addEventListener('input',function(){mv.textContent=this.value;});
    var tog=document.getElementById('briefingToggle');
    if(tog)tog.addEventListener('click',function(){S.settings.briefingEnabled=!S.settings.briefingEnabled;renderSection();});
  });
  return d;
}

// ── Sidebar ────────────────────────────────────────────────────────────────
var NAV=[{key:'overview',e:'⬛',label:'Overview'},{key:'commodities',e:'📈',label:'Commodities'},{key:'distributors',e:'👥',label:'Distributors'},{key:'profitability',e:'💹',label:'Profitability'},{key:'landed',e:'📦',label:'Landed Cost'},{key:'copilot',e:'🧠',label:'Copilot AI',badge:'AI'},{key:'briefings',e:'📋',label:'Briefings'},{key:'news',e:'📰',label:'News'},{key:'settings',e:'⚙️',label:'Settings'}];

function buildSidebar(collapsed){
  var sb=div('sidebar'+(collapsed?' collapsed':''));
  var logo=div('','','padding:'+(collapsed?'14px 0':'14px 16px')+';display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--br);justify-content:'+(collapsed?'center':'space-between'));
  if(!collapsed){var lt=div('');lt.innerHTML='<div style="font-size:13px;font-weight:900;color:var(--c);letter-spacing:3px">COMPASS</div><div style="font-size:8px;color:var(--dim);font-weight:700;letter-spacing:2px">ANGOALISSAR · v2</div>';logo.appendChild(lt);}
  var togBtn=btn('☰','','background:none;border:none;color:var(--dim);padding:4px;font-size:18px;font-family:var(--f)');togBtn.addEventListener('click',function(){S.collapsed=!S.collapsed;render();});logo.appendChild(togBtn);sb.appendChild(logo);
  if(!collapsed){var pp=div('','','padding:8px 12px;border-bottom:1px solid var(--br)');pp.appendChild(provincePill(S.province));sb.appendChild(pp);}
  var nav=div('','','flex:1;padding-top:6px');
  NAV.forEach(function(item){
    var isA=S.section===item.key;
    var nb=btn('','nav-btn'+(isA?' active':'')+(collapsed?' cbtn':''));
    if(isA){var bar=div('','','position:absolute;left:2px;top:18%;bottom:18%;width:2px;background:var(--c);border-radius:1px');nb.appendChild(bar);}
    var ico=document.createElement('span');ico.style.cssText='font-size:15px';ico.textContent=item.e;nb.appendChild(ico);
    if(!collapsed){var lbl=document.createElement('span');lbl.style.cssText='font-size:11px;font-weight:'+(isA?700:400)+';color:'+(isA?'var(--c)':'var(--dim)')+';flex:1;text-align:left;letter-spacing:.5px';lbl.textContent=item.label;nb.appendChild(lbl);}
    if(!collapsed&&item.badge){var bdg=div('','','font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;background:var(--c);color:var(--bg);letter-spacing:1px');bdg.textContent=item.badge;nb.appendChild(bdg);}
    nb.addEventListener('click',function(){S.section=item.key;renderSection();closeMobileSidebar();});
    nav.appendChild(nb);
  });
  sb.appendChild(nav);
  if(!collapsed){
    var feed=div('','','border-top:1px solid var(--br);padding:10px 12px');
    feed.innerHTML='<div style="font-size:8px;color:var(--dim);font-weight:800;margin-bottom:8px;letter-spacing:2px">◉ LIVE · '+(S.province?S.province.toUpperCase():'ALL')+'</div>';
    S.newsFeed.filter(function(n){return !S.province||!n.prov||n.prov===S.province;}).slice(0,3).forEach(function(n){
      var row=div('','','display:flex;gap:6px;margin-bottom:8px;align-items:flex-start');
      var dot=div('','','width:4px;height:4px;border-radius:50%;background:'+SENT_COLOR[n.sent]+';margin-top:4px;flex-shrink:0');row.appendChild(dot);
      var nt=div('','','font-size:9px;color:var(--dim);line-height:1.4');nt.textContent=n.headline.slice(0,52)+'…';row.appendChild(nt);feed.appendChild(row);
    });
    sb.appendChild(feed);
  }
  return sb;
}

// ── Ticker ─────────────────────────────────────────────────────────────────
function buildTickerHTML(){
  var items=S.fxRates.concat(S.fxRates);
  return items.map(function(r){return '<span style="padding:0 18px;font-size:10px;border-right:1px solid var(--br);display:inline-flex;align-items:center;gap:7px"><span style="color:var(--dim);font-weight:700">'+r.pair+'</span><span style="color:var(--tx);font-weight:800">'+r.rate.toFixed(1)+'</span><span style="color:'+(r.chg>=0?'var(--g)':'var(--r)')+';font-size:9px">'+(r.chg>=0?'▲':'▼')+' '+Math.abs(r.chg).toFixed(1)+'</span></span>';}).join('');
}
var tickerOffset=0,tickerRaf;
function startTicker(){
  if(tickerRaf)cancelAnimationFrame(tickerRaf);
  function run(){var inner=document.querySelector('.ticker-inner');if(inner){tickerOffset-=.5;if(tickerOffset<-inner.scrollWidth/2)tickerOffset=0;inner.style.transform='translateX('+tickerOffset+'px)';}tickerRaf=requestAnimationFrame(run);}
  tickerRaf=requestAnimationFrame(run);
}

// ── Province helpers ───────────────────────────────────────────────────────
function setProv(p){S.province=p;try{p?localStorage.setItem('compass_province',p):localStorage.removeItem('compass_province');}catch(e){}render();}
function closeMobileSidebar(){var mob=document.getElementById('mobileSidebar');if(mob)mob.remove();}

function buildProvDropdown(parent){
  var existing=document.getElementById('provDD');if(existing){existing.remove();return;}
  var dd=div('panel','','position:absolute;top:110%;right:0;width:210px;z-index:100;padding:6px;max-height:280px;overflow-y:auto;border:1px solid var(--brh);box-shadow:0 8px 32px rgba(0,0,0,.5)');
  var allb=btn('All Provinces','','width:100%;padding:7px 10px;border-radius:6px;background:'+(!S.province?'var(--c)18':'transparent')+';border:none;color:'+(!S.province?'var(--c)':'var(--dim)')+';text-align:left;font-size:11px;font-weight:'+(!S.province?700:400)+';font-family:var(--f)');
  allb.addEventListener('click',function(e){e.stopPropagation();setProv(null);dd.remove();});dd.appendChild(allb);
  PROVINCES.forEach(function(p){var pb=btn(p,'','width:100%;padding:6px 10px;border-radius:6px;background:'+(S.province===p?'var(--c)12':'transparent')+';border:none;color:'+(S.province===p?'var(--c)':'var(--dim)')+';text-align:left;font-size:10px;font-weight:'+(S.province===p?700:400)+';font-family:var(--f)');pb.addEventListener('click',function(e){e.stopPropagation();setProv(p);dd.remove();});dd.appendChild(pb);});
  parent.style.position='relative';parent.appendChild(dd);
  setTimeout(function(){document.addEventListener('click',function rmDD(){dd.remove();document.removeEventListener('click',rmDD);});},10);
}

// ── CSV / PPTX ─────────────────────────────────────────────────────────────
function openCSV(){
  var prov=S.province,prices=prov?ALL_PRICES.filter(function(p){return p.province===prov;}):ALL_PRICES;
  var mb=div('modal-bg');
  var box=div('panel modal-box');
  var hrow=div('','','display:flex;justify-content:space-between;align-items:center;margin-bottom:16px');
  var htxt=div('');htxt.innerHTML='<div style="font-size:14px;font-weight:900;color:var(--tx)">EXPORT CSV</div>';htxt.appendChild(provincePill(prov));hrow.appendChild(htxt);
  var xb=btn('✕','','background:none;border:none;color:var(--dim);font-size:20px;font-family:var(--f)');xb.addEventListener('click',function(){mb.remove();});hrow.appendChild(xb);box.appendChild(hrow);
  box.innerHTML+='<div style="font-size:10px;color:var(--dim);margin-bottom:10px">'+prices.length+' rows · Preview:</div>';
  var prev=div('','','overflow-x:auto;background:var(--panel);border-radius:8px;padding:10px;margin-bottom:16px;border:1px solid var(--br)');
  var tbl=document.createElement('table');var cols=['province','commodity','price','currency','unit'];
  var thead=document.createElement('thead');thead.innerHTML='<tr>'+cols.map(function(c){return '<th style="color:var(--c)">'+c+'</th>';}).join('')+'</tr>';tbl.appendChild(thead);
  var tbody=document.createElement('tbody');prices.slice(0,5).forEach(function(r){var tr=document.createElement('tr');tr.innerHTML=cols.map(function(c){return '<td style="font-size:10px;padding:4px 10px">'+r[c]+'</td>';}).join('');tbody.appendChild(tr);});tbl.appendChild(tbody);prev.appendChild(tbl);box.appendChild(prev);
  var dlb=btn('⬇ DOWNLOAD CSV','','padding:11px 22px;background:var(--c);color:var(--bg);border:none;border-radius:8px;font-size:11px;font-weight:800;font-family:var(--f)');
  dlb.addEventListener('click',function(){var csv=[cols.join(',')].concat(prices.map(function(r){return cols.map(function(c){return r[c];}).join(',');})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='compass_'+(prov||'all')+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();mb.remove();});
  box.appendChild(dlb);mb.appendChild(box);document.body.appendChild(mb);
}

function openPPTX(){
  var prov=S.province;
  var mb=div('modal-bg');
  var box=div('panel modal-box','','max-width:500px;border:1px solid var(--brh)');
  var hrow=div('','','display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px');
  var htxt=div('');htxt.innerHTML='<div style="font-size:15px;font-weight:900;color:var(--tx);letter-spacing:1px">BOARD PRESENTATION</div><div style="font-size:10px;color:var(--dim);margin-top:3px">Export to PowerPoint</div>';htxt.appendChild(provincePill(prov));hrow.appendChild(htxt);
  var xb=btn('✕','','background:none;border:none;color:var(--dim);font-size:20px;font-family:var(--f)');xb.addEventListener('click',function(){mb.remove();});hrow.appendChild(xb);box.appendChild(hrow);
  [['📊','Executive Summary','Revenue, volume, margin, DSO KPIs'],['💹','Market Prices','Commodity prices by province and trend'],['👥','Distributor Performance','Rankings, scorecards, radar profile'],['📈','Profitability Analysis','Margin by brand, region, channel, SKU'],['⚡','Risks & Opportunities','Market intelligence and competitive analysis'],['🎯','Action Plan','3 priority commercial actions']].forEach(function(si,i){box.innerHTML+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--br);border:1px solid var(--br);border-radius:8px;margin-bottom:8px"><span style="font-size:18px">'+si[0]+'</span><div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--tx)">Slide '+(i+1)+': '+si[1]+'</div><div style="font-size:10px;color:var(--dim)">'+si[2]+'</div></div></div>';});
  var expb=btn('📊 EXPORT PPTX','','width:100%;margin-top:4px;padding:13px;background:var(--c);color:var(--bg);border:none;border-radius:10px;font-size:12px;font-weight:800;font-family:var(--f);display:flex;align-items:center;justify-content:center;gap:10px');
  expb.addEventListener('click',function(){var lines=['ANGOALISSAR COMPASS — BOARD PRESENTATION','Generated: '+new Date().toLocaleString('en-GB'),'Scope: '+(prov||'All Angola'),''].concat([['Executive Summary','Revenue, volume, margin KPIs'],['Market Prices','Commodity prices by province'],['Distributor Performance','Rankings and scorecards'],['Profitability Analysis','Margin by brand and channel'],['Risks & Opportunities','Market intelligence'],['Action Plan','3 priority actions']].map(function(si,i){return 'SLIDE '+(i+1)+': '+si[0]+'\n'+si[1];}));var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='Angoalissar_Board_'+(prov||'Angola')+'_'+new Date().toISOString().slice(0,10)+'.txt';a.click();mb.remove();});
  box.appendChild(expb);mb.appendChild(box);document.body.appendChild(mb);
}

// ── Main render ────────────────────────────────────────────────────────────
function renderSection(){
  var mc=document.getElementById('mainContent');if(!mc)return;mc.innerHTML='';
  var fns={overview:renderOverview,commodities:renderCommodities,distributors:renderDistributors,profitability:renderProfitability,landed:renderLandedCost,copilot:renderCopilot,briefings:renderBriefings,news:renderNews,settings:renderSettings};
  var fn=fns[S.section];if(fn)mc.appendChild(fn());
}

function render(){
  var app=document.getElementById('app');app.innerHTML='';
  app.appendChild(buildSidebar(S.collapsed));
  var main=document.createElement('main');
  // Topbar
  var topbar=div('topbar');
  var tl=div('','','display:flex;align-items:center;gap:12px');
  var mobBtn=btn('☰','mob-btn','background:none;border:none;color:var(--c);padding:4px;font-size:20px;font-family:var(--f);display:none');
  mobBtn.addEventListener('click',function(){var existing=document.getElementById('mobileSidebar');if(existing){existing.remove();return;}var overlay=div('','');overlay.id='mobileSidebar';overlay.style.cssText='position:fixed;inset:0;z-index:200';var bg=div('','','position:absolute;inset:0;background:rgba(0,0,0,.75)');bg.addEventListener('click',function(){overlay.remove();});var msb=buildSidebar(false);msb.style.cssText=msb.style.cssText+'position:absolute;left:0;top:0;bottom:0;display:flex!important';overlay.appendChild(bg);overlay.appendChild(msb);document.body.appendChild(overlay);});
  tl.appendChild(mobBtn);
  var secName=NAV.find(function(n){return n.key===S.section;});
  var si=div('');si.innerHTML='<div style="font-size:13px;font-weight:800;color:var(--tx);letter-spacing:1px">'+((secName&&secName.label)||'').toUpperCase()+'</div><div style="font-size:9px;color:var(--dim);letter-spacing:1px">'+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div>';
  tl.appendChild(si);topbar.appendChild(tl);
  var tr=div('','','display:flex;gap:8px;align-items:center;flex-wrap:wrap');
  // Theme quick switcher
  var themeBtns=div('','','display:flex;gap:4px');
  [['dark','🌑'],['light','☀️'],['neon','🟣']].forEach(function(ti){var tb=btn(ti[1],'','padding:5px 8px;border-radius:6px;font-size:14px;background:'+(S.theme===ti[0]?'var(--c)':'var(--panel)')+';border:1px solid '+(S.theme===ti[0]?'var(--c)':'var(--br)')+';font-family:var(--f)');tb.title=ti[0]+' theme';tb.addEventListener('click',function(){applyTheme(ti[0]);render();});themeBtns.appendChild(tb);});
  tr.appendChild(themeBtns);
  var provWrap=div('');provWrap.style.position='relative';
  var provBtn=btn('','','display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--mid);font-size:10px;font-family:var(--f)');
  provBtn.innerHTML='📍 <span style="color:var(--tx);font-weight:700">'+(S.province||'ALL')+'</span> ▾';
  provBtn.addEventListener('click',function(e){e.stopPropagation();buildProvDropdown(provWrap);});
  provWrap.appendChild(provBtn);tr.appendChild(provWrap);
  var pptxBtn=btn('📊 PPTX','','padding:6px 12px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--c);font-size:10px;font-weight:700;font-family:var(--f)');pptxBtn.addEventListener('click',openPPTX);tr.appendChild(pptxBtn);
  var csvBtn=btn('⬇ CSV','','padding:6px 12px;background:var(--panel);border:1px solid var(--br);border-radius:8px;color:var(--c);font-size:10px;font-weight:700;font-family:var(--f)');csvBtn.addEventListener('click',openCSV);tr.appendChild(csvBtn);
  topbar.appendChild(tr);main.appendChild(topbar);
  // Ticker
  var ticker=div('ticker-wrap');ticker.innerHTML='<div class="ticker-inner" style="display:flex;white-space:nowrap">'+buildTickerHTML()+'</div>';main.appendChild(ticker);
  // Province pill + clear
  var ppRow=div('','','padding:10px 22px 0;display:flex;align-items:center;gap:8px');ppRow.appendChild(provincePill(S.province));
  if(S.province){var clr=btn('✕ CLEAR','','font-size:9px;color:var(--dim);background:none;border:none;letter-spacing:.5px;font-family:var(--f)');clr.addEventListener('click',function(){setProv(null);});ppRow.appendChild(clr);}
  main.appendChild(ppRow);
  var mc=div('content');mc.id='mainContent';main.appendChild(mc);
  app.appendChild(main);
  renderSection();
  requestAnimationFrame(startTicker);
}

render();
</script>
</body>
</html>
